<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اَلصَّيَّاد | متجر أدوات صيد النيل</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Announcement Bar -->
    <div class="announcement-bar">
        🚚 شحن سريع لكل أنحاء مصر — الدفع عند الاستلام متاح
    </div>

    <!-- Header -->
    <header class="site-header">
        <div class="container header-wrapper">
            
            <!-- YOUR NEW IMAGE LOGO GOES HERE -->
            <div class="logo" onclick="goHome()">
                <img src="logo.png" alt="شعار الصياد">
            </div>
            
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="ما الذي تبحث عنه؟ (مكن، بوص، خيوط...)" onkeyup="searchProducts()">
                <button onclick="searchProducts()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <nav class="desktop-nav">
                <button class="active" onclick="filterProducts('all')">الرئيسية</button>
                <button onclick="filterProducts('rods')">بوص وسنارات</button>
                <button onclick="filterProducts('reels')">مكن الصيد</button>
                <button onclick="filterProducts('lines')">الخيوط</button>
                <button onclick="filterProducts('hooks')">السنون</button>
                <button onclick="filterProducts('accessories')">مستلزمات الصيد</button>
            </nav>

            <div class="cart-icon desktop-cart" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count-desktop" class="badge">0</span>
            </div>
        </div>
    </header>

    <main id="home-view" class="main-content">
        <!-- Trust Bar -->
        <section class="trust-bar container">
            <div class="trust-item">
                <i class="fa-solid fa-shield-halved"></i>
                <span>ماركات أصلية 100%</span>
            </div>
            <div class="trust-item">
                <i class="fa-solid fa-truck-fast"></i>
                <span>توصيل سريع لمحافظات مصر</span>
            </div>
            <div class="trust-item hide-mobile">
                <i class="fa-solid fa-hand-holding-dollar"></i>
                <span>الدفع عند الاستلام</span>
            </div>
            <div class="trust-item hide-mobile">
                <i class="fa-solid fa-headset"></i>
                <span>دعم فني من صيادين محترفين</span>
            </div>
        </section>

        <!-- Product Grid -->
        <section class="container" id="products-section">
            <h2 class="section-title" id="category-title">وصل حديثاً (معدات النيل)</h2>
            <div class="product-grid" id="product-grid">
                <!-- Products dynamically injected here via JS -->
            </div>
        </section>
    </main>

    <!-- Product Details View -->
    <main id="product-view" style="display: none;" class="container main-content">
        <button class="back-btn" onclick="goHome()"><i class="fa-solid fa-angle-right"></i> العودة للمتجر</button>
        <div class="product-details-layout" id="product-details-container">
            <!-- Details dynamically injected here -->
        </div>
    </main>

    <!-- Mobile Bottom App Navigation -->
    <nav class="mobile-bottom-nav">
        <div class="nav-item" onclick="filterProducts('all')">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </div>
        <div class="nav-item" onclick="filterProducts('rods')">
            <i class="fa-solid fa-water"></i>
            <span>بوص</span>
        </div>
        <div class="nav-item" onclick="filterProducts('reels')">
            <i class="fa-solid fa-gear"></i>
            <span>مكن</span>
        </div>
        <div class="nav-item" onclick="filterProducts('lines')">
            <i class="fa-solid fa-dharmachakra"></i>
            <span>خيوط</span>
        </div>
        <div class="nav-item cart-nav-item" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>السلة</span>
            <span id="cart-count-mobile" class="mobile-badge">0</span>
        </div>
    </nav>

    <!-- Cart Modal for Checkout -->
    <div class="modal-overlay" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>عربة التسوق</h2>
                <button class="close-btn" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="cart-items" class="cart-items"></div>
            
            <div class="cart-total-box">
                <span>الإجمالي:</span>
                <span id="cart-total" class="total-price">0.00 ج.م</span>
            </div>
            
            <div class="checkout-section">
                <h3>معلومات التوصيل والشحن</h3>
                <form action="https://formspree.io/f/mzdlnozp" method="POST" id="checkout-form" onsubmit="clearCartOnSubmit()">
                    <input type="text" name="الاسم" placeholder="الاسم بالكامل" required>
                    <input type="tel" name="رقم الهاتف" placeholder="رقم الهاتف للتواصل" required>
                    <textarea name="العنوان" placeholder="عنوان الشحن (المحافظة، المنطقة، الشارع، العقار)" required></textarea>
                    <textarea name="Order_Details" id="hidden-order-details" style="display: none;"></textarea>
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 10px;">إتمام الطلب</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

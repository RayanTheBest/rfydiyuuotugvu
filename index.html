
<!DOCTYPE html>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
      --bg: #0f1115;
      --surface: #1c1f26;
      --surface-border: #2d313a;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --correct: #10b981;
      --correct-bg: rgba(16, 185, 129, 0.1);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    
    html, body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      height: 100%; width: 100%;
      overflow: hidden;
      position: fixed;
      overscroll-behavior: none;
    }

    body { display: flex; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0; }

    #sidebar { width: 320px; height: 100%; background: var(--surface); border-right: 1px solid var(--surface-border); display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1001; flex-shrink: 0; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--surface-border); }
    #nav-list { flex: 1; overflow-y: auto; list-style: none; padding: 10px; -webkit-overflow-scrolling: touch; }
    .nav-sec { margin-top: 15px; margin-bottom: 5px; padding: 5px 10px; font-size: 0.75rem; text-transform: uppercase; color: var(--primary); font-weight: 800; letter-spacing: 1px; border-bottom: 1px solid rgba(59, 130, 246, 0.2); }
    .nav-item { padding: 12px 15px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; color: var(--text-muted); }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav-item.active { background: var(--primary); color: white; font-weight: 500; }

    #main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; width: 100%; height: 100%; overflow: hidden; }
    #topbar { height: 60px; width: 100%; border-bottom: 1px solid var(--surface-border); display: flex; align-items: center; padding: 0 15px; background: rgba(28, 31, 38, 0.9); backdrop-filter: blur(10px); gap: 15px; z-index: 1000; flex-shrink: 0; }
    .menu-toggle { display: none; background: none; border: none; color: white; cursor: pointer; padding: 5px; }

    #question-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; display: flex; flex-direction: column; gap: 20px; max-width: 1000px; margin: 0 auto; width: 100%; }

    .card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--radius); padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; }
    .stimulus { font-size: 1.1rem; color: var(--text); margin-bottom: 25px; line-height: 1.8; border-left: 4px solid var(--primary); padding-left: 20px; }
    .stem { font-size: 1.15rem; font-weight: 500; margin-bottom: 25px; word-wrap: break-word; }
    
    /* Global Content Overrides */
    u { text-underline-offset: 4px; text-decoration-thickness: 1px; }
    strong { color: var(--primary); }

    /* Tables */
    table { width: 100%; border-collapse: collapse; margin: 20px 0; background: rgba(255,255,255,0.02); border-radius: 8px; overflow: hidden; }
    th, td { border: 1px solid var(--surface-border); padding: 12px; text-align: left; }
    th { background: rgba(59, 130, 246, 0.1); font-weight: 700; color: var(--primary); }
    
    /* Graphs */
    svg { max-width: 100%; height: auto; display: block; margin: 20px auto; filter: invert(1) hue-rotate(180deg) brightness(1.2); }

    /* Ultimate MathML Styles */
    math { font-family: "Latin Modern Math", serif; font-size: 1.15em; vertical-align: middle; display: inline-block; }
    mfrac { padding: 0 4px; vertical-align: middle; }
    msup, msub, msubsup { vertical-align: baseline; }
    
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option { display: flex; padding: 16px 20px; border: 1px solid var(--surface-border); border-radius: 8px; background: rgba(0,0,0,0.2); }
    .option.correct { border-color: var(--correct); background: var(--correct-bg); }
    .opt-letter { font-weight: 700; margin-right: 15px; color: var(--text-muted); }

    .nav-btn { padding: 12px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; flex: 1; max-width: 200px; }
    .nav-btn:hover { background: var(--primary-hover); }

    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      #sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); width: 280px; }
      #sidebar.open { transform: translateX(0); box-shadow: 10px 0 50px rgba(0,0,0,0.5); }
      .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
      .sidebar-overlay.open { display: block; }
      .stimulus { font-size: 1rem; }
      .stem { font-size: 1.05rem; }
    }

    .fade-in { animation: fadeIn 0.3s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  <script>
    const examDataRaw = {"deviceId":"DESKTOP-92QV2DV","package":{"id":"8697672e-07d2-4e36-a459-0f3f330ed721","spid":"583ec563-35d9-42b4-9e56-21a6ca799855","program":"1","subject":"118","test":{"id":"739d5930-516a-4073-ab62-8ec303147d4c","instructions":"","sections":[{"id":"7d8785ef-ce14-4f6a-99dc-09e4608ad5bd","type":"routing","title":"Section 1, Module 1: Reading and Writing","instructions":"<p class=\"dap_body\">The questions in this section address a number of important reading and writing skills. Each question includes one or more passages, which may include a table or graph. Read each passage and question carefully, and then choose the best answer to the question based on the <span class=\"tts-container\" ssml-label=\"Substitution\" data-ssml-sub-alias=\"passage or passages\">passage(s)</span>.&nbsp;</p><p class=\"dap_body\">All questions in this section are multiple-choice with four answer choices. Each question has a single best answer.</p>","duration":32,"navigateBack":"yes","holdStudentAtEnd":true,"useSectionEndRoom":true,"enableAnnotationsTool":true,"chunks":[{"id":"d1190479-1588-4df3-a4e6-63b3149a8e27","type":"chunk","items":[{"id":"c6e5e978-01c7-4103-a9c4-d59d24bc57be","type":"mcq","stem":"<p>Which choice completes the text with the most logical and precise word or phrase?</p>","stimulus":"<p>Ronald Reagan&rsquo;s career had a lot of <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span>. Before becoming president of the United States, he held many different jobs. He was a lifeguard, a sports radio announcer, an actor in <em>Desperate Journey</em> and other films, and the governor of California.</p>","answerOptions":[{"id":"783cdc81-5a5c-46d5-9414-3874fd52024a","content":"<p>clarity</p>"},{"id":"94bc0c2f-6b53-460c-9ecb-6ac614602d7d","content":"<p>disappointment</p>"},{"id":"4cb4afb8-998a-461b-97c1-77c5400d3cfc","content":"<p>mystery</p>"},{"id":"e9d15d0a-fec4-4051-aa6e-bc3f9a8d46b8","content":"<p>variety</p>"}],"displayNumber":"1"}]},{"id":"ff5ec862-c047-4e85-a45a-3c25bc2c5894","type":"chunk","items":[{"id":"df2c3754-fa34-4177-a145-3f1fedaeefc8","type":"mcq","stem":"<p>As used in the text, what does the word &ldquo;end&rdquo; most nearly mean?</p>","stimulus":"<p>The following text is adapted from Jhumpa Lahiri&rsquo;s 2003 novel <em>The&nbsp;Namesake</em>. Gogol has recently begun working at an architecture firm in New York.</p>\n<blockquote>\n<p>His contributions are incidental, and never fully his own: a stairwell, a skylight, a corridor, an air-conditioning duct. Still, he knows that each component of a building, however small, is nevertheless essential, and he finds it gratifying that after all his years of schooling, all his crits [reviews] and unbuilt projects, his efforts are to have some practical <span role=\"region\" aria-label=\"Referenced Content\"><u>end</u>.</span></p>\n</blockquote>\n<p style=\"text-align: right;\"><span class=\"dap_copyright\">&copy;2003 by Jhumpa Lahiri</span></p>","answerOptions":[{"id":"70e25894-1ce3-439f-b6f9-1db1ea9634ce","content":"<p>Expiration</p>"},{"id":"2f2bf10a-51c0-4543-8ab0-290a83e081d1","content":"<p>Purpose</p>"},{"id":"322ede82-7980-4784-83b7-8d3e33aa6000","content":"<p>Decision</p>"},{"id":"b732422a-67a7-460f-ba2b-076426de3564","content":"<p>Border</p>"}],"displayNumber":"2"}]},{"id":"f6f49483-7188-4fee-b812-b2d604e438ef","type":"chunk","items":[{"id":"bc379595-b5ad-4130-bdb3-2b9e49f6c9e1","type":"mcq","stem":"<p>Which choice completes the text with the most logical and precise word or phrase?</p>","stimulus":"<p>Along with traditional Japanese forms of woodwork and weaving, sashiko embroidery was revived during the <em><span lang=\"ja\">mingei</span></em> (folk art) movement of the twentieth century. Sashiko&rsquo;s functional origins as a mending technique and its use of motifs inspired by everyday life, such as <span lang=\"ja\"><em>seigaiha</em></span> (wave), reflect the principle that folk art should <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> its form and themes from the lives of its creators.</p>","answerOptions":[{"id":"331930cd-472d-4d7c-a096-a48597d13a03","content":"<p>withdraw</p>"},{"id":"90b18581-a3fd-413d-8dc7-89920147bc45","content":"<p>derive</p>"},{"id":"3a63f187-68d4-4084-ad6f-ea9b20d143f7","content":"<p>distinguish</p>"},{"id":"b022a6c5-2b0c-4e02-a094-8d414491b9f7","content":"<p>promote</p>"}],"displayNumber":"3"}]},{"id":"1cc29911-a7ea-4e27-a087-66c3277274ed","type":"chunk","items":[{"id":"2852b997-0403-4db0-aba5-9e38d94263ef","type":"mcq","stem":"<p>Which choice completes the text with the most logical and precise word or phrase?</p>","stimulus":"<p>Pingping Chen <span data-ssml-sub-alias=\"et al\">et al.</span> suggest that the extinct aquatic insect <em>Karataviella popovi</em> utilized a brood care strategy that mitigated the risk of pathogens. This determination rests on the researchers&rsquo; analysis of fossils uncovered at a particularly <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> site: China&rsquo;s Haifanggou Formation, which has yielded a vast diversity of fossils, including those of giant fleas.</p>","answerOptions":[{"id":"2140efb8-8917-4ef5-b171-6c03efea4af1","content":"<p>unassailable</p>"},{"id":"50c6db82-b0e8-4c9f-87d0-2b10ace980df","content":"<p>obscure</p>"},{"id":"d7287c9b-b45b-4efe-bd8a-85f8e4f4dfe1","content":"<p>fruitful</p>"},{"id":"6b96232e-ba8c-4288-b4d0-d8815290599f","content":"<p>quantified</p>"}],"displayNumber":"4"}]},{"id":"b19b3070-a8c8-4d17-9a41-6022c339f8b5","type":"chunk","items":[{"id":"49a9f1a5-7a89-438f-927e-e537a1936cd5","type":"mcq","stem":"<p>Which choice best describes the overall structure of the text?</p>","stimulus":"<p>The following text is adapted from J.M. Barrie&rsquo;s 1911 novel <em>Peter Pan</em>.</p>\n<blockquote>\n<p>[Children] soon know that they will grow up, and the way Wendy knew was this. One day when she was two years old she was playing in a garden, and she plucked another flower and ran with it to her mother. I suppose she must have looked rather delightful, for Mrs. Darling put her hand to her heart and cried, &ldquo;Oh, why can&rsquo;t you remain like this for ever!&rdquo; This was all that passed between them on the subject, but henceforth Wendy knew that she must grow up.</p>\n</blockquote>","answerOptions":[{"id":"9183efbf-c96d-487f-9d5b-fcbf594c319f","content":"<p>It states an assumption about children and then considers the ways in which Wendy differs from others.</p>"},{"id":"b04e852c-2b40-4b3b-b790-aae8010ea693","content":"<p>It makes a prediction about Wendy&rsquo;s future and then presents a reason for making that prediction.</p>"},{"id":"8381d7ba-32a5-453b-883c-c0defc17ab5f","content":"<p>It presents a question about Wendy&rsquo;s behavior and then offers a detailed answer.</p>"},{"id":"f782b4b0-5372-410a-81d9-1ea911c027e9","content":"<p>It makes a claim about children and then illustrates it with a description of Wendy&rsquo;s experience.</p>"}],"displayNumber":"5"}]},{"id":"5276e7a6-7065-46f0-ac0f-66e33a0151b9","type":"chunk","items":[{"id":"381c60fa-729a-4b5b-bbba-792bee65dd15","type":"mcq","stem":"<p>Based on the texts, how would Fabian and team (Text 2) most likely respond to the information presented in Text 1?</p>","stimulus":"<p><span class=\"paired_passage\" role=\"heading\" aria-level=\"2\"><strong>Text 1</strong></span></p>\n<p><em><em>Actias luna</em></em> is one of many nocturnal moths that exhibit positive phototaxis, or attraction to light. One hypothesis is that moths are innately drawn toward moonlight and mistake artificial lights for it. And this attraction causes real harm: flying around an artificial light source leaves moths exposed to predators.&nbsp;</p>\n<p>&nbsp;</p>\n<p><span class=\"paired_passage\" role=\"heading\" aria-level=\"2\"><strong>Text 2</strong></span></p>\n<p>Samuel Fabian and team found that moths and other nocturnal insects oriented their backs toward light sources while in flight. The team reasoned that this behavior likely evolved to help insects stay upright by keeping their backs toward the moon. Insects&rsquo; being surrounded by artificial lights confounds this instinct, making the insects struggle to stay level. Hence, the team concluded that these insects aren&rsquo;t attracted to the lights but rather are disoriented by them.</p>","answerOptions":[{"id":"6327e3d4-446a-4782-b7f0-8bdda34588e6","content":"<p>By pointing out that the claim that many moths exhibit positive phototaxis is based on a misunderstanding of how moths and other insects interact with light</p>"},{"id":"b9699cba-ca5d-44a5-95c5-304523f79bed","content":"<p>By conceding that artificial lights affect moths and other insects differently depending on those lights&rsquo; specific attributes</p>"},{"id":"bd506069-6921-47a7-b9c2-e828de0d92d1","content":"<p>By asserting that moths are more likely than other insects to exhibit positive phototaxis because moth species are overwhelmingly nocturnal, unlike most insect species</p>"},{"id":"610fc477-a86a-4f68-b01b-1fd932844ed9","content":"<p>By arguing that artificial lights are less damaging to moths and other insects than some researchers have previously suggested</p>"}],"displayNumber":"6"}]},{"id":"05ef80b2-b883-487c-be0a-60fd5ccaf1d5","type":"chunk","items":[{"id":"942c22e8-1fa2-43a2-80e9-eabbdb7ea748","type":"mcq","stem":"<p>Which quotation from <em>Poems </em>most effectively illustrates the claim?</p>","stimulus":"<p><em>Poems</em> is an <span data-ssml-say-as=\"date\">1895</span> collection of poetry by Frances <span data-ssml-sub-alias=\"E W\">E.W.</span> Harper. In one of Harper&rsquo;s poems, the speaker recalls a memory so vivid that it seems immediate rather than something from the distant past, saying, <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span></p>","answerOptions":[{"id":"437294d6-95fb-44ce-bc53-02b3598f22ae","content":"<p>&ldquo;My mother&rsquo;s kiss, my mother&rsquo;s kiss, / I feel its impress now; / As in the bright and happy days / She pressed it on my brow.&rdquo; (from &ldquo;My Mother&rsquo;s Kiss&rdquo;)</p>"},{"id":"dcf5fcc7-1434-43e0-937f-f87cfce82f21","content":"<p>&ldquo;Welcome children of the Spring, / In your garbs of green and gold, / Lifting up your sun-crowned heads / On the verdant plain and wold.&rdquo; (from &ldquo;Dandelions&rdquo;)</p>"},{"id":"0a69ac6c-660b-4d4c-9a3e-d48099fccc7d","content":"<p>&ldquo;Let me make the songs for the people, / Songs for the old and young; / Songs to stir like a battle-cry / Wherever they are sung.&rdquo; (from &ldquo;Songs for the People&rdquo;)</p>"},{"id":"944f4dee-3dc9-40aa-841f-5a6b14ea43e0","content":"<p>&ldquo;God bless our native land, / Her homes and children bless, / Oh may she ever stand / For truth and righteousness.&rdquo; (from &ldquo;God Bless Our Native Land&rdquo;)</p>"}],"displayNumber":"7"}]},{"id":"42cf5a8f-2826-483f-9cd0-31ce778fec5e","type":"chunk","items":[{"id":"6855806b-299b-4b26-bb37-f6e8da93ef2e","type":"mcq","stem":"<p>Which choice best describes data from the table that support Martinez and colleagues&rsquo; hypothesis?</p>","stimulus":"<p><figure class=\"table\"><table class=\"gdr\"><caption style=\"caption-side: top;\"><p style=\"text-align: center;\">Orientation of Paired Leaves in Grapevines and Related Species</p></caption><thead><tr><th scope=\"col\" style=\"text-align: center;vertical-align: bottom;\">Species</th><th scope=\"col\" style=\"text-align: center;vertical-align: bottom;\">Total leaf pairs examined</th><th scope=\"col\" style=\"text-align: center;vertical-align: bottom;\">Pairs with opposite-side orientation</th><th scope=\"col\" style=\"text-align: center;vertical-align: bottom;\">Pairs with same-side orientation</th><th scope=\"col\" style=\"text-align: center;vertical-align: bottom;\">Ratio of opposite-side orientations to same-side orientations (<em>n</em> to 1)</th></tr></thead><tbody><tr><th scope=\"row\" style=\"text-align: left;\"><em>Vitis</em>&ensp;<span aria-hidden=\"true\">&times;</span><span class=\"sr-only\">crossed with</span>&ensp;<em>champinii</em></th><td style=\"text-align: center;\">32</td><td style=\"text-align: center;\">26</td><td style=\"text-align: center;\">6</td><td style=\"text-align: center;\">4.33</td></tr><tr><th scope=\"row\" style=\"text-align: left;\"><em>Ampelopsis glandulosa</em></th><td style=\"text-align: center;\">47</td><td style=\"text-align: center;\">38</td><td style=\"text-align: center;\">9</td><td style=\"text-align: center;\">4.22</td></tr><tr><th scope=\"row\" style=\"text-align: left;\"><em>Vitis thunbergii</em></th><td style=\"text-align: center;\">11</td><td style=\"text-align: center;\">6</td><td style=\"text-align: center;\">5</td><td style=\"text-align: center;\">1.20</td></tr><tr><th scope=\"row\" style=\"text-align: left;\"><em>Vitis acerifolia</em></th><td style=\"text-align: center;\">209</td><td style=\"text-align: center;\">165</td><td style=\"text-align: center;\">44</td><td style=\"text-align: center;\">3.75</td></tr></tbody></table></figure></p>\n<p>Auxins are a class of hormones that influence plant growth, including leaf orientation (the tendency of leaves to be larger on one side of their long central axis than the other). Ciera Martinez and colleagues noted that in certain plants in which leaves grow in pairs, auxins will typically be concentrated in opposite sides of each leaf in the pair (e.g., on the left side of one leaf in the pair and the right side of the other) and hypothesized that this tendency should be reflected in leaf orientation.</p>","answerOptions":[{"id":"6c32011e-420d-4cee-b5b4-afa3707895a5","content":"<p>Among the species shown, no more than 9 pairs show orientation in the same direction, whereas at least 165 pairs show orientation in opposite directions.&nbsp;</p>"},{"id":"e136610b-419f-49d4-a5d3-93d274638309","content":"<p>The number of pairs oriented in the same direction range from 5 to 44 in the species shown, whereas the number of pairs oriented in opposite directions range from 11 to 209.&nbsp;</p>"},{"id":"08b80a6a-55e8-4cfc-9300-f4e0379adfc5","content":"<p>Pairs in which the leaves are oriented in opposite directions are more common than pairs in which the leaves are oriented in the same direction by a ratio of at least 1.20 to 1 in the species shown.&nbsp;</p>"},{"id":"00e3d447-fb4e-4911-9649-5cd6e1305b04","content":"<p>The ratio of pairs oriented in opposite directions to pairs oriented in the same direction range from a low of 6 to 1 to a high of 165 to 1 in the species shown.&nbsp;</p>"}],"displayNumber":"8"}]},{"id":"66876bab-46ff-4e88-a064-dd36725a5062","type":"chunk","items":[{"id":"7c8a456e-b66b-45f8-acec-a077e1549da3","type":"mcq","stem":"<p>Which finding, if true, would most directly support the underlined claim?</p>","stimulus":"<p>Predating the European colonization of the Pacific Northwest, the Salish wool dog vanished due to interbreeding with dogs brought from Europe. In contrast, the Greenland dog persists as a distinct breed, and DNA testing confirms its descent from precolonial North American dogs. It also has genetic markers found in the dogs of East Asia but absent in those of Europe. That finding supports the theory that the precolonial breeds developed by Indigenous peoples descend from dogs that migrated from Asia in the last ice age. <span style=\"text-decoration: underline;\" role=\"region\" aria-label=\"Referenced Content\">The Carolina dog, a yellow-coated breed native to rural pockets of the Southeastern United States, likely has such an origin too.</span></p>","answerOptions":[{"id":"56e22684-6efc-4bf6-a71f-30d64ebeb7bb","content":"<p>Dogs in feral populations in the Southeastern United States have a set of genes also found in East Asian breeds imported in recent decades.</p>"},{"id":"d7197549-abc1-4b44-8356-38c5efc6a56a","content":"<p>The Carolina dog carries a genetic marker that is not found in the dog populations of Europe but is present in the dog populations of East Asia.&nbsp;</p>"},{"id":"1d25f2e5-a0a2-4cfe-b134-72fccbaf9bbc","content":"<p>Identical genetic markers are identified in remains of both the Salish wool dog and a dog population it interbred with.</p>"},{"id":"dbdfa62c-dff2-41ac-9c51-286e501b2949","content":"<p>Additional DNA testing confirms that the Greenland dog and the Carolina dog share a rare set of genes not found in any East Asian breeds.</p>"}],"displayNumber":"9"}]},{"id":"3b02623c-8f6f-44d0-9112-0b6a6340eb7b","type":"chunk","items":[{"id":"c3e96e76-f0d2-4401-b0af-e9f657751a95","type":"mcq","stem":"<p>Which finding, if true, would best support the researcher&rsquo;s hypothesis?</p>","stimulus":"<p>The Rar&aacute;muri language of northern Mexico has 20 vowel and consonant sounds. In contrast, the Hadza language of eastern Africa has 70. Why would languages differ in this way? One researcher has hypothesized that when modern humans arose in Africa, they spoke a single language, but as humans gradually spread throughout Africa and then around the globe, that language developed into new languages. Those developed into still more languages as small bands of humans spread even farther, with each new language retaining fewer sounds from humanity&rsquo;s original language.</p>","answerOptions":[{"id":"0d2ac4a5-1e4f-4421-bb9f-1367a3fc1a91","content":"<p>Languages that emerged in Western Europe tend to have more sounds than languages that emerged in Central America do, and Western Europe is closer to Africa than Central America is.</p>"},{"id":"186f2994-5e97-4aa1-9cb8-f94e3435cdbc","content":"<p>Languages that emerged in northwestern North America tend to have more sounds than languages that emerged in East Asia do, even though northwestern North America is farther away from Africa than East Asia is.</p>"},{"id":"048869aa-42e3-413c-aafa-7d00c5ab5347","content":"<p>Languages that emerged in Southeast Asia tend to have more sounds than languages that emerged in East Asia do, even though the two regions are roughly the same distance from Africa.</p>"},{"id":"57e0d83d-c996-4a6b-b158-261aba36f32f","content":"<p>Languages that emerged in Western Europe tend to have fewer sounds than languages that emerged in Southeast Asia do, and Western Europe is closer to Africa than Southeast Asia is.</p>"}],"displayNumber":"10"}]},{"id":"8b90514c-09cb-4d36-a08a-52226c04e664","type":"chunk","items":[{"id":"635f6ac3-110d-4e2e-8b41-98f5d68d9933","type":"mcq","stem":"<p>Which choice most logically completes the text?</p>","stimulus":"<p>It is hard for publishers and printers to create very long books that balance the requirements of readability, durability, and cost. Among some exceptionally long novels published in English, Edoardo Albinati&rsquo;s <em>The Catholic School</em> (translated from Italian) was published in a 1,263-page edition and runs to an estimated 591,000 words, while David Rotenberg&rsquo;s <em>Shanghai</em> (written originally in English) was published in a 1,156-page edition and runs to an estimated 800,000 words. This suggests that <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span></p>","answerOptions":[{"id":"7d2b3aaa-3595-43f0-8c54-a6da19f73549","content":"<p>readers will, on average, take the same time to read <em>Shanghai</em> as they will to read <em>The Catholic School</em>.</p>"},{"id":"e3747065-21f6-4dc9-ad90-d0a1475f3668","content":"<p>the edition of <em>Shanghai</em> has more words per page than the edition of <em>The Catholic School</em>.</p>"},{"id":"4af9a825-ad12-4544-acd7-e399f2f488a0","content":"<p>the edition of <em>The Catholic School</em> was less expensive to print than the edition of <em>Shanghai</em>.</p>"},{"id":"485b2488-7eea-4e9b-a278-2effbfa52759","content":"<p><em>The Catholic School</em> likely has a lower word count in its original Italian edition.</p>"}],"displayNumber":"11"}]},{"id":"307b2fa6-da00-400d-bf70-cb5abfa872bb","type":"chunk","items":[{"id":"92918632-9f85-4dc5-a1b4-7bf27ee23028","type":"mcq","stem":"<p>Which choice most logically completes the text?</p>","stimulus":"<p>At Cayo Largo (Puerto Rico), coral colonies experiencing degradation&mdash;a problem facing reefs globally&mdash;have been enhanced with transplanted fragments of elkhorn (a stony coral). This is a useful restoration approach but is challenging at scale since it involves cultivating and individually moving young stony coral pieces. In <span data-ssml-say-as=\"date\">2025</span>, Samapti Kundu and her team announced a new approach: coating reef substrates with a simple-to-apply substance, made with inexpensive and abundant core components (<span data-ssml-sub-alias=\"e g\">e.g.</span>, gelatin), that can mimic a signal that draws coral larvae to settle in healthy reefs. When tested in conditions simulating real ocean environments, the substance enhanced settlement by up to twentyfold. These attributes suggest that the substance <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span></p>","answerOptions":[{"id":"417afb6c-54bc-435d-b22f-b959de17ccf8","content":"<p>is likely to require more costly components to ensure its stability when used for coral colonies as degraded as those at Cayo Largo.</p>"},{"id":"e1fc7a46-d1b3-498b-beba-1a8a7eea3735","content":"<p>should be able to simulate healthy reef signals even more closely when it is applied in natural ocean conditions.</p>"},{"id":"08083bc0-6265-4033-abee-499b13a62c7d","content":"<p>should be most beneficial for restoring reefs that predominantly consist of elkhorn coral colonies.</p>"},{"id":"13d561da-ed16-40a2-9af3-b52be1f5a8a6","content":"<p>offers a means of reef restoration that likely allows much broader implementation than the approach used at Cayo Largo does.</p>"}],"displayNumber":"12"}]},{"id":"7e858cef-a7d5-4f94-a86f-988b7e749c82","type":"chunk","items":[{"id":"33cb06ae-9380-4d02-a782-e98db826f5af","type":"mcq","stem":"<p>Which choice most logically completes the text?</p>","stimulus":"<p>Carl Woese&rsquo;s 1970s study of methanogens (microbes with no nuclei, such as <em>Methanobrevibacter ruminantium</em>, that metabolize hydrogen and carbon dioxide in oxygen-poor environments and produce methane as a by-product) suggested that they did not fit scientists&rsquo; then-conventional division of life into two domains, the eukaryotes (having cells with nuclei) and the prokaryotes (missing nuclei). Molecular clock evidence indicated that what Woese argued was a third domain of life emerged as early as 3.5 billion years ago. Methanogens would have been well-adapted to conditions then given that <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span></p>","answerOptions":[{"id":"d69e43fe-004f-4b25-9341-5f328524799b","content":"<p>atmospheric hydrogen levels were much lower around 3.5 billion years ago than they were both earlier and later in Earth&rsquo;s history.</p>"},{"id":"0b437488-1b58-4153-ba96-233a091a72cb","content":"<p>the earliest undisputed evidence of eukaryotes is much more recent than 3.5 billion years ago.</p>"},{"id":"6f6fe933-0d51-49f0-8a8d-55e2c733d4f4","content":"<p>methane, while primarily biological in origin on Earth, can be produced in the absence of biological activity.</p>"},{"id":"3cf631ed-1296-4700-9756-d6b22131340d","content":"<p>Earth&rsquo;s oxygen levels were very low until the Great Oxidation Event approximately 2.4 billion years ago.</p>"}],"displayNumber":"13"}]},{"id":"c94eeb0f-0661-45b1-ab9a-61a05a2c99ee","type":"chunk","items":[{"id":"fb49ef0a-7fcd-4a22-837a-8dc1e6f08d39","type":"mcq","stem":"<p>Which choice most logically completes the text?</p>","stimulus":"<p>For parts of <em>The Canterbury Tales</em> (<span data-ssml-sub-alias=\"circa\">ca.</span> 1390s), Chaucer drew from preexisting works, including Jacobus Januensis’s <em>Legenda aurea</em>. Though <em>Filocolo</em> and other works by Boccaccio are also indisputably among Chaucer&rsquo;s sources, some scholars have assumed that he didn&rsquo;t consult Boccaccio&rsquo;s <em>Decameron</em>.<em> </em>They posit he<em> </em>instead derived the story of Griselda, which appears in the <em>Decameron</em>, exclusively from intermediary sources, such as <em>Miroir des dames mariées, </em>Philippe de Mézières’s French translation of Boccaccio’s version, to which Chaucer added segments of thematic commentary not found in the intermediaries. In these segments, Jessica Harkins has identified strong lexical affinities with Boccaccio&rsquo;s version occurring at the same narrative moments, suggesting that <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span></p>","answerOptions":[{"id":"993390bd-6548-4662-9999-56d9b1a768b1","content":"<p>although it is uncertain how much of Chaucer&rsquo;s narrative of Griselda derives from the intermediary sources and how much derives directly from the <em>Decameron</em>, it is likely that the majority of the thematic commentary is original to Chaucer.</p>"},{"id":"41fdbcb0-8f84-4362-9b88-9d7828c349e4","content":"<p>contrary to what some scholars have assumed, Chaucer may have directly consulted Boccaccio&rsquo;s text in addition to de Mézières’s version and the versions in other intermediary sources when adapting the narrative of Griselda.</p>"},{"id":"ad62dfd8-9e9b-4baf-8ce9-052bb47d1b6c","content":"<p>although it remains likely that Chaucer principally relied on de Mézières’s version and the versions in other intermediary sources when adapting the narrative of Griselda, the possibility that Chaucer consulted Boccaccio for other parts of <em>The </em><em>Canterbury Tales</em> shouldn&rsquo;t be discounted, as some scholars have done.</p>"},{"id":"095d456b-c10e-4b63-ac9a-3edc0209f884","content":"<p>contrary to what scholars have argued about Chaucer&rsquo;s familiarity with Boccaccio&rsquo;s works, some evidence suggests that he was at least aware of their existence, though their influence on <em>The </em><em>Canterbury Tales</em> as a whole was likely relatively minor compared with that of works by de Mézières and Jacobus Januensis.</p>"}],"displayNumber":"14"}]},{"id":"a90a9926-5bf8-4451-aa07-5711aee3ab89","type":"chunk","items":[{"id":"6e90ade2-e9c7-41a5-ba85-e26e4d3272d3","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>Portuguese researcher Isabel <span data-ssml-sub-alias=\"C F R\">C.F.R.</span> Ferreira found that velvet shank mushrooms contain ferulic acid, an antioxidant that combats free radicals, which are molecules that can damage healthy cells in organisms. Ferreira hopes to harness mushroom antioxidants <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> an array of conditions in animals and plants alike.</p>","answerOptions":[{"id":"80708c49-c77a-4a2c-a843-8778b77f9c17","content":"<p>to prevent and treat</p>"},{"id":"1de25584-d768-45e1-9eac-9ba72c84ec42","content":"<p>preventing and treated</p>"},{"id":"199d2a0a-9633-4462-a10f-ba3d7ebd4f61","content":"<p>preventing and to treat</p>"},{"id":"ac62bd36-616f-43f4-a09e-caed07387686","content":"<p>to prevent and treating</p>"}],"displayNumber":"15"}]},{"id":"fa95bf70-be37-477c-96dd-6c3dacd67179","type":"chunk","items":[{"id":"0237d696-3a2c-4863-ae4c-c9eb80ec3b5b","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>The lamp of the White Shoal Lighthouse in Emmet County, Michigan, built in <span data-ssml-say-as=\"date\">1910</span>, is now powered by electricity. But prior to the advent of electricity, other fuels were needed. According to historians, <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span></p>","answerOptions":[{"id":"889f3b74-11b1-4f7f-a396-98f4acbe73a7","content":"<p>would lighthouses like White Shoal have used oil or kerosene in their lamps<span data-ssml-say-as=\"characters\">?</span></p>"},{"id":"5b42ed01-caa1-42ee-b26c- <em><span data-ssml-sub-alias=\"U S\">U.S.</span> News &amp; World Report</em> has produced data-driven reports on various aspects of culture and society, including an annual ranking of the best jobs in the United States. In January <span data-ssml-say-as=\"date\">2021</span>, the publication, using such metrics as median salary and work-life balance, <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> that statisticians had the sixth best job in the country.</p>","answerOptions":[{"id":"c1523b94-265c-459c-80e0-7db7df4bf401","content":"<p>concluded</p>"},{"id":"5b3ff8c7-060e-41ec-98c9-cdd42b3cccde","content":"<p>has concluded</p>"},{"id":"b61f2067-673e-4b8c-a3da-31edd82ab0ff","content":"<p>is concluding</p>"},{"id":"767eb346-2d68-4b3c-9e2c-8fd1328a7632","content":"<p>concludes</p>"}],"displayNumber":"18"}]},{"id":"06f28d8d-2555-4066-ac79-27a9bc402d8d","type":"chunk","items":[{"id":"21c69f5d-5287-45b9-8335-2611f4f85f34","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>Vermont is one of several US states with legislative provisions for the incorporation of worker cooperatives, businesses in which each worker receives an equal vote in company governance. Skeptics have questioned the co-op model for decades and declared <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> means of governance economically unsustainable, ignoring many examples of successful worker-owned businesses.</p>","answerOptions":[{"id":"986199ad-97de-4a51-a49b-6e094025c697","content":"<p>its</p>"},{"id":"62c0defe-7986-4013-b849-a45350d44960","content":"<p>one&rsquo;s</p>"},{"id":"82cc5c7d-f7fc-4c6f-b841-2cf50a211bac","content":"<p>they&rsquo;re</p>"},{"id":"9defb12a-1ab4-4edc-8716-72d83362b0c7","content":"<p>their</p>"}],"displayNumber":"19"}]},{"id":"1429aa96-8e5a-4c78-9ba5-133fc6b51a9c","type":"chunk","items":[{"id":"67f989c1-bd27-4364-874c-fad590383433","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>For their <em>What the Hat</em> series, visual artists Anna Dev&iacute;s and Daniel Rueda created photographs in which Dev&iacute;s poses with a wide-brimmed hat in front of a partially completed minimalist background, using her hat as the whimsical image&rsquo;s missing element. In <em>Hat-mony</em>, Dev&iacute;s wears a pink and black hat that becomes the turntable of a record <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> in <em>Eggcellent</em>, she wears an orange hat that becomes the yolk of a cracked egg.</p>","answerOptions":[{"id":"49a1def7-d2df-47f9-a315-b51015130696","content":"<p>player<span data-ssml-say-as=\"characters\">.</span> For instance<span data-ssml-say-as=\"characters\">,</span> while</p>"},{"id":"a11241de-83ce-47f2-bc7b-e85f6f186b80","content":"<p>player<span data-ssml-say-as=\"characters\">,</span> for instance<span data-ssml-say-as=\"characters\">,</span> while</p>"},{"id":"8525a45b-2e24-4510-afe8-06e62735c382","content":"<p>player<span data-ssml-say-as=\"characters\">;</span> for instance<span data-ssml-say-as=\"characters\">,</span>&nbsp;</p>"},{"id":"4b6534ff-e1b3-4fb7-a657-f321041a77dd","content":"<p>player<span data-ssml-say-as=\"characters\">,</span> for instance<span data-ssml-say-as=\"characters\">,</span>&nbsp;</p>"}],"displayNumber":"20"}]},{"id":"90f993ea-1370-4388-9d65-e2636663abe1","type":"chunk","items":[{"id":"aa75ed62-728a-4c73-8804-11ef5c75a94c","type":"mcq","stem":"<p>Which choice completes the text with the most logical transition?</p>","stimulus":"<p>The eastern chipmunk (<em>Tamias striatus</em>) has areas of white fur that fluoresce with a white glow under ultraviolet (UV) light. This phenomenon occurs because the fur&rsquo;s keratin fibers lack the pigment that typically prevents fluorescence. <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> the absence of the natural pigment melanin allows tryptophan molecules in the keratin to absorb UV radiation and then re-emit it as visible light, producing the fluorescent glow.</p>","answerOptions":[{"id":"f2716979-ff9e-4e38-a44e-3f26a7e741d4","content":"<p>For instance,</p>"},{"id":"df7ed7c9-8e41-4c9b-8f91-0d2349f06702","content":"<p>Additionally,</p>"},{"id":"ebd89553-d5e1-4279-aff1-4f47eec3034b","content":"<p>Conversely,</p>"},{"id":"99858bd0-aa10-4418-a653-7299eda9a248","content":"<p>Specifically,</p>"}],"displayNumber":"21"}]},{"id":"606550b7-9760-4ad4-a98c-0b5237545b70","type":"chunk","items":[{"id":"ef34d761-f0bc-48c9-8854-de4a34962ae5","type":"mcq","stem":"<p>Which choice completes the text with the most logical transition?</p>","stimulus":"<p>Textile artist Amber Joy Greenidge-Sabral wanted to avoid using harsh synthetic dyes that could be damaging to the environment. <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> she began experimenting with more environmentally friendly natural dye methods, using organic materials like sassafras and black locust for their natural orange and blue colors.</p>","answerOptions":[{"id":"5a37cfc8-31f5-49b6-b8f5-6f98a3a2c573","content":"<p>In reality,</p>"},{"id":"b6b7e5e0-362d-48da-a911-fbb3c65d0eb5","content":"<p>In any case,</p>"},{"id":"ae362b71-50f3-4733-aa9e-90d765ec6f69","content":"<p>To that end,</p>"},{"id":"e1267ffe-cee6-4cdc-823e-f428072cb31a","content":"<p>On the other hand,</p>"}],"displayNumber":"22"}]},{"id":"91650625-d56f-4024-9534-0325acba965b","type":"chunk","items":[{"id":"6f1f773c-1d67-4d09-a3a6-f3dddd324875","type":"mcq","stem":"<p>Which choice completes the text with the most logical transition?</p>","stimulus":"<p>In the past, the White House has played host to a diverse menagerie of pets, including the Andalusian donkey owned by George Washington, the nation&rsquo;s first president. <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> for the last few decades, nearly every White House pet has been a cat or dog.</p>","answerOptions":[{"id":"1301e08e-e28b-42c4-a252-aa7b8d1755d3","content":"<p>Ultimately, Washington&rsquo;s uncommon pet choice had little bearing on his political legacy;</p>"},{"id":"4848f618-f5db-4027-ab08-82c895063d98","content":"<p>In fact, all but a few US presidents have kept pets during their tenure in office;</p>"},{"id":"8d309e32-b4b8-4fbe-a931-68eb277ff796","content":"<p>That said, recent US presidents have stuck to more conventional choices;</p>"},{"id":"f13940e3-a331-45ed-81b8-58dc87617a14","content":"<p>Indeed, it&rsquo;s been suggested that pet ownership can bolster a president&rsquo;s public image;</p>"}],"displayNumber":"23"}]},{"id":"50eb511a-92b4-4f52-bcc9-c4fe5ed075d3","type":"chunk","items":[{"id":"e5a20c2f-6dcf-4d35-9155-1d677c840bf4","type":"mcq","stem":"<p>Which choice completes the text with the most logical transition?</p>","stimulus":"<p>Sara Cwynar employed several artistic techniques in her <span data-ssml-say-as=\"date\">2019</span> work <em>Board Room</em>. <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> the work is notable for the artist&rsquo;s use of collage, which involves assembling various materials to create a composition.</p>","answerOptions":[{"id":"c237a279-28bc-4e3b-ad62-4f482845ccaa","content":"<p>In particular,</p>"},{"id":"f0861c1a-2a39-41a2-81f0-10e0e44288f4","content":"<p>Therefore,</p>"},{"id":"6a511d7f-23de-4394-951e-0545e84987fc","content":"<p>By contrast,</p>"},{"id":"7dd915b8-848b-41bf-8da2-d38520be7e5e","content":"<p>Instead,</p>"}],"displayNumber":"24"}]},{"id":"1ae56717-a684-49b2-9309-b4392bbe1862","type":"chunk","items":[{"id":"8b573e54-f752-49b4-86a1-6699b24e1f08","type":"mcq","stem":"<p>Which choice completes the text with the most logical transition?</p>","stimulus":"<p>In a <span data-ssml-say-as=\"date\">2022</span> analysis of small sovereign countries, Archie Simpson categorized forty-one as microstates based, in part, on the criterion of having a population under one million&mdash;for instance, Malta, with its population of approximately 533,000. <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> political scholar Sarina Theys suggests an intersubjective approach to classification by which a small country&rsquo;s status is self-defined rather than relying on externally imposed or quantitative standards.</p>","answerOptions":[{"id":"adf7246b-5ccc-42f0-80a3-11dab70e9798","content":"<p>Countering this method of categorization,</p>"},{"id":"61acfa1f-4eee-4452-84a6-f175074a23c7","content":"<p>Reinforcing the importance of Simpson&rsquo;s population criterion,</p>"},{"id":"adba3e59-8374-412e-bf54-3c5df5d07400","content":"<p>Challenging the accuracy of Malta&rsquo;s population data,</p>"},{"id":"66359bad-9995-4ce4-b955-8abb25719401","content":"<p>In addition to this example,</p>"}],"displayNumber":"25"}]},{"id":"0c538150-c376-4ec2-8858-0d01ac0a35a4","type":"chunk","items":[{"id":"91369c76-b158-46af-a7ab-0e6f97440b5e","type":"mcq","stem":"<p>The student wants to say what vinegar and pears have in common. Which choice best uses information from the notes to do this?</p>","stimulus":"<p><p>While researching a topic, a student has taken the following notes:</p>\n<ul>\n<li>Vinegar has a pH value of approximately 2.5.</li>\n<li>Pears have a pH value of approximately 3.9.</li>\n<li>Substances with pH values below 7 are acidic.</li>\n</ul></p>","answerOptions":[{"id":"8f4eb2c9-485f-4705-8680-99fa60efc271","content":"<p>Vinegar and pears are both acidic substances.</p>"},{"id":"0ce93ea0-3fe5-40d5-8ab8-42a38e205d40","content":"<p>Some acidic substances have pH values of approximately 3.9.</p>"},{"id":"9d665e15-1ab3-463f-a7fa-3ebd94c9c375","content":"<p>Vinegar has a pH value that makes it acidic.</p>"},{"id":"42be8e61-9f2b-4bc8-9d56-508db9d46fa0","content":"<p>Vinegar and pears have pH values of approximately 2.5.</p>"}],"displayNumber":"26"}]},{"id":"6761141f-28dd-4007-a620-f626571a7a38","type":"chunk","items":[{"id":"5bba8169-3bd5-46df-9ccb-cc087b06da59","type":"mcq","stem":"<p>Which choice most effectively uses information from the given sentences to specify why Leslie Valiant won the <span data-ssml-sub-alias=\"A M\">A.M.</span> Turing Award?</p>","stimulus":"<ul>\n<li>The <span data-ssml-sub-alias=\"A M\">A.M.</span> Turing Award is a prestigious award given by the Association for Computing Machinery (ACM).</li>\n<li>The ACM gives the award for &ldquo;major contributions of lasting importance to computing.&rdquo;</li>\n<li>Leslie Valiant won the award in <span data-ssml-say-as=\"date\">2010</span> for transformative contributions to the theory of computation.</li>\n</ul>","answerOptions":[{"id":"b3ed6237-8021-45bc-bbae-186bcf8404b4","content":"<p>Leslie Valiant won the <span data-ssml-sub-alias=\"A M\">A.M.</span> Turing Award for transformative contributions to the theory of computation.</p>"},{"id":"4c64d23b-7c5a-40db-a86d-c0313c43ed6d","content":"<p>Leslie Valiant is a winner of the ACM&rsquo;s prestigious <span data-ssml-sub-alias=\"A M\">A.M.</span> Turing Award.</p>"},{"id":"d74332f2-7672-40df-a161-8cceda792f4d","content":"<p>Generally, the prestigious <span data-ssml-sub-alias=\"A M\">A.M.</span> Turing Award is given for &ldquo;major contributions of lasting importance to computing.&rdquo;</p>"},{"id":"2fa7a362-51f0-4cb4-93a3-ff99a8bac09c","content":"<p>It was in <span data-ssml-say-as=\"date\">2010</span> that Leslie Valiant won the <span data-ssml-sub-alias=\"A M\">A.M.</span> Turing Award.</p>"}],"displayNumber":"27"}]}],"calculatorAdvantage":["None"],"defaultDuration":32,"enableTts":false},{"id":"14e7016b-ea55-4e4f-8440-1302e37b34ab","type":"destination","title":"Section 1, Module 2: Reading and Writing","instructions":"<p class=\"dap_body\">The questions in this section address a number of important reading and writing skills. Each question includes one or more passages, which may include a table or graph. Read each passage and question carefully, and then choose the best answer to the question based on the <span class=\"tts-container\" ssml-label=\"Substitution\" data-ssml-sub-alias=\"passage or passages\">passage(s)</span>.&nbsp;</p><p class=\"dap_body\">All questions in this section are multiple-choice with four answer choices. Each question has a single best answer.</p>","duration":32,"navigateBack":"yes","holdStudentAtEnd":true,"useSectionEndRoom":true,"enableAnnotationsTool":true,"breakAfter":{"duration":10,"studentAdvanced":true},"chunks":[{"id":"8ac4c842-1640-4186-a972-6ad5395f5dc2","type":"chunk","items":[{"id":"43c47b47-99e8-41ae-a846-71e70e6b316a","type":"mcq","stem":"<p>Which choice completes the text with the most logical and precise word or phrase?</p>","stimulus":"<p>Tiny European green crabs have taken over habitats of native oysters and many other animals in the United States. But it&rsquo;s possible to <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> the harm caused by these crabs by reducing their numbers. For example, biologists suggest using the crabs in soups.</p>","answerOptions":[{"id":"bb9f2ca6-7080-46f2-8716-f2ce2f836e45","content":"<p>view</p>"},{"id":"40d69135-b6df-40ac-9852-8615046da658","content":"<p>lessen</p>"},{"id":"6cbe6c05-4735-4ce1-a853-5a3eab57ce42","content":"<p>gather</p>"},{"id":"beb4d1ab-74de-47e0-8918-a97b22c856c4","content":"<p>visit</p>"}],"displayNumber":"1"}]},{"id":"2f92f109-fb2b-493e-a9e2-e1062100b430","type":"chunk","items":[{"id":"696bc9c8-94b2-4f03-85b3-691c5326fc48","type":"mcq","stem":"<p>Which choice completes the text with the most logical and precise word or phrase?</p>","stimulus":"<p>Community art often involves members of a community working with professional artists to complete a project. When people think of community art, they typically think of visual art objects, such as murals, but these initiatives aren&rsquo;t just confined to the visual; they often <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> ballet and other performing arts as well.</p>","answerOptions":[{"id":"6538e630-34bf-481e-a606-4b7739250d9b","content":"<p>extend to</p>"},{"id":"2ca12c4b-a7e6-4e3a-894f-2ccda6f70f25","content":"<p>remain at</p>"},{"id":"92e2848c-2f1e-49f8-af0d-3c6d7dd799d4","content":"<p>hesitate at</p>"},{"id":"c51a65c1-2173-4f5d-aa1f-e93140a63e71","content":"<p>react to</p>"}],"displayNumber":"2"}]},{"id":"e6b53079-0c38-493b-9e8f-cb1f53c30e53","type":"chunk","items":[{"id":"05248b7d-54f8-4579-8cf2-0db4d72fae11","type":"mcq","stem":"<p>Which choice completes the text with the most logical and precise word or phrase?</p>","stimulus":"<p>Research has shown that regardless of musical training, most hearing adults recognize that the notes of the simple melody of &ldquo;Love Me Tender&rdquo; are harmonious. Similarly, a study showed that even participants with no musical training could easily follow the underlying beat in the Brazilian samba song &ldquo;Desafinado&rdquo; despite its often complex rhythms, raising the possibility that this capability was somehow <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> the participants.</p>","answerOptions":[{"id":"b0fba8a7-af63-4e97-a695-4fbb407fc39c","content":"<p>unique to</p>"},{"id":"f47ad1f6-af93-41d2-9b27-779d19a244ae","content":"<p>undertaken by</p>"},{"id":"a37427d3-7bc4-4e67-8e81-3a4ec2adb483","content":"<p>instinctive for</p>"},{"id":"44a2f18e-7259-4884-a076-f842657a7e44","content":"<p>imposed on</p>"}],"displayNumber":"3"}]},{"id":"9fbd5d05-4548-47f6-b0bd-7daa6839c2dd","type":"chunk","items":[{"id":"25730020-f6ba-40f7-b4c7-ef5d14fb5d04","type":"mcq","stem":"<p>Which choice completes the text with the most logical and precise word or phrase?</p>","stimulus":"<p>Studying wrappers from discontinued candies, postcards from vanished tourist destinations, and posters promoting concerts by long-forgotten musicians may seem like a frivolous pursuit, but ephemeral objects like these are useful as evidence of cultural change: they can <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> shifts in norms, values, and concerns that traditional objects of historical inquiry may not.</p>","answerOptions":[{"id":"45e9061f-b3ef-4780-a527-e2b28db44936","content":"<p>dissociate from</p>"},{"id":"ab3a3b51-578c-4567-b787-f8a1036690cf","content":"<p>collude with</p>"},{"id":"9b8a2b65-ef92-4404-81ec-dc8b2def734b","content":"<p>compensate for</p>"},{"id":"1d74dd47-0e3b-49a2-9c18-df30c23b698b","content":"<p>attest to</p>"}],"displayNumber":"4"}]},{"id":"d8e3d280-4c10-45a1-9f69-b75706bf03d4","type":"chunk","items":[{"id":"b88943dc-2d37-4824-8616-4638f7ebc351","type":"mcq","stem":"<p>Which choice best states the main purpose of the text?</p>","stimulus":"<p>Kissimmee River in Florida hosts one of a growing number of restoration projects that target the hyporheic zone (HZ), a subsurface region where groundwater and surface water mix, creating a richly biodiverse habitat. While rebuilding an HZ&rsquo;s physical structure (<span data-ssml-sub-alias=\"e g\">e.g.</span>, with gravel) might be feasible, is it possible to restore its biological community? To explore this question, scientists seeded restored HZs in Washington&rsquo;s Thornton Creek with non-biting midges and other locally extirpated species. Although the restored areas were colonized quickly, it was mostly by species from the unrestored sections of the creek rather than by the reintroduced species.</p>","answerOptions":[{"id":"0c6f08df-68d9-4d5d-b3b3-a70c57a4529b","content":"<p>To introduce an approach while acknowledging that it wasn&rsquo;t fully successful</p>"},{"id":"fb0fbec5-1f44-437e-8885-b01730af9b71","content":"<p>To trace difficulties in implementing a plan to a flawed understanding of a concept &nbsp;</p>"},{"id":"373540ae-13d4-43e6-a7ba-5c65c4633ab6","content":"<p>To describe a trend while suggesting that it may prove to have negative consequences</p>"},{"id":"703704a1-938d-4105-9d3f-c9129afa76bc","content":"<p>To expose a contradiction underlying a particular methodology&nbsp;</p>"}],"displayNumber":"5"}]},{"id":"a0587f02-771e-49ff-8026-205a2a993474","type":"chunk","items":[{"id":"fcbd5da5-14e5-4487-839e-d606fc092afe","type":"mcq","stem":"<p>Which choice best describes the overall structure of the text?</p>","stimulus":"<p>The HMS<em> Algerine</em> is just one of approximately three million known historical shipwrecks spread throughout the world&rsquo;s oceans, and their impact on sea life and underwater ecosystems is of great interest to researchers. Leila Hamdan and colleagues were particularly curious about the effects of wooden shipwrecks on seafloor microbial communities. The researchers studied two wooden shipwrecks in the Gulf of Mexico by placing pieces of pine and oak between zero and 200 meters away from each shipwreck to collect samples of three kinds of microbes: bacteria, archaea, and fungi. They found that across the three microbial communities, peak diversity and richness was observed on pine and oak samples placed approximately 125 meters from the shipwrecks.</p>","answerOptions":[{"id":"f11067f4-7d6c-4d32-8f71-80c225cf3a06","content":"<p>It introduces a study of microbial communities near shipwrecks that has received significant scholarly attention, summarizes the results of that study, and then describes a research team&rsquo;s reaction to the study.</p>"},{"id":"cac39e0b-ebe5-422c-85f3-1e48c79cf73c","content":"<p>It notes a general scientific interest in shipwrecks&rsquo; ecological effects, describes a specific study related to that interest, and then states one of the study&rsquo;s findings.</p>"},{"id":"be7eeab8-cd3a-4755-a5fc-2eb2042fdcc7","content":"<p>It states the number of known shipwrecks, describes the historical significance of one of those shipwrecks, and then comments on the various microbes found at the shipwreck site.</p>"},{"id":"2c45bcdc-2056-4e4b-a723-a28b38c95e02","content":"<p>It names a famous historical shipwreck, describes the type of wood used to build that ship, and then explains how that wood type influences underwater microbial communities.</p>"}],"displayNumber":"6"}]},{"id":"15739722-c39c-4c99-8bc7-2a018cba12f3","type":"chunk","items":[{"id":"f8c584c3-fea9-40dd-ae80-dff2167f199d","type":"mcq","stem":"<p>Which choice best states the main purpose of the text?</p>","stimulus":"<p>Popularized in sixteenth- and seventeenth-century England by such poets as William Shakespeare and Mary Wroth, the sonnet sequence (a series of fourteen-line poems unified by overarching thematic concerns) remains a prevalent poetic genre. Although the sonnet&rsquo;s intricate, rule-bound structure makes writing even one sonnet&mdash;let alone an entire series&mdash;intrinsically challenging, more recent poets from Gwendolyn Brooks to Natalie Diaz have undertaken sonnet sequences, likely in part because of the opportunity the genre presents for showcasing a poet&rsquo;s virtuosity and ingenuity.</p>","answerOptions":[{"id":"584feefe-47fc-4119-8db3-be3ff1972f2c","content":"<p>To enumerate the structural features of sonnet sequences that make them challenging to compose</p>"},{"id":"f59b398d-a6cc-4a91-bfd6-0692db359772","content":"<p>To contrast the more creative sonnet sequences of Brooks and Diaz with the more conventional ones of Shakespeare and Wroth</p>"},{"id":"efcaf4d3-d80b-45fa-94f0-150eb11fbdaf","content":"<p>To describe some of the innovations Brooks and Diaz have introduced to the sonnet sequence</p>"},{"id":"c20ea952-aeeb-4e79-8353-bcacbeba1aca","content":"<p>To suggest a reason for the enduring appeal of the sonnet sequence among poets despite its challenging form&nbsp;</p>"}],"displayNumber":"7"}]},{"id":"fa8c2767-6c51-4b29-a654-f71a521281cf","type":"chunk","items":[{"id":"7d6fe2e2-c3c8-4d19-980a-ab2bf99d1026","type":"mcq","stem":"<p>Which choice best describes the function of the underlined portion in the text as a whole?</p>","stimulus":"<p>The Ganges–Brahmaputra Delta Aquifer in Bangladesh is among many coastal aquifers that are vulnerable to saltwater intrusion due to groundwater overexploitation and sea level rise. In some settings, engineers employ managed aquifer recharge (MAR), injecting water at strategic sites to raise groundwater pressure. <span style=\"text-decoration: underline;\" role=\"region\" aria-label=\"Referenced Content\">Due to its greater density, seawater forms a wedge beneath fresh water;</span> thus, even small increases in groundwater pressure can shift the interface seaward. MAR utilizes this phenomenon to create a hydraulic barrier that holds the wedge back, preventing landward movement that could contaminate supply wells.&nbsp;</p>","answerOptions":[{"id":"491d0c54-484d-458c-9188-fb1646aede99","content":"<p>It establishes a specific set of conditions that contributes to the environmental problem identified at the beginning of the text.</p>"},{"id":"d838be15-b7b4-42be-baa1-0b7b4d08b92d","content":"<p>It offers a reason why the remediation technique discussed in the text is particularly appropriate in certain settings.&nbsp;</p>"},{"id":"b0cbc52d-a591-4b84-a081-922440ea3809","content":"<p>It introduces a naturally occurring phenomenon that complicates the plan of corrective action outlined by the text.</p>"},{"id":"f10d4ba1-6dc6-4fbc-afe7-e522702c75db","content":"<p>It describes an effect of a difference in physical properties that is exploited by the method explained by the text.</p>"}],"displayNumber":"8"}]},{"id":"ce8ccda6-136c-4a16-8bd0-ff96a1c6120c","type":"chunk","items":[{"id":"b847a1dc-20d9-4c8e-823d-cdfc67c1c0c3","type":"mcq","stem":"<p>Which choice best states the main purpose of the text?</p>","stimulus":"<p>From the Ad&eacute;lie penguin to the North Atlantic right whale, a wide range of semiaquatic species have been found to share a common approach for saving energy when traveling long distances. To minimize both wave drag at the surface and the vertical distance to reach the surface to breathe, these air-breathing marine animals swim at depths around three times their body diameter. This finding has important implications for animal conservation efforts. For example, considering typical swim depths could help inform the use of vertically zoned protections in protected marine habitats.</p>","answerOptions":[{"id":"76a6fd03-d049-49f7-907e-ba7f5c07bc59","content":"<p>To summarize a theory that accounts for why most air-breathing marine animals swim at the same depth regardless of their size</p>"},{"id":"7f606252-599d-4adb-a61a-98c47de4d8cd","content":"<p>To present a finding about the behavior of certain species that may help conservationists protect those species</p>"},{"id":"46b3dae8-cbb4-4a05-92b6-8c4aa731565d","content":"<p>To identify a shared trait across several species that makes the conservation of those species particularly challenging</p>"},{"id":"36d0a0ee-533c-4296-b1a6-cf80d53698ce","content":"<p>To describe a general trend in the swim depths of certain species that explains why those species are more efficient swimmers than are other semiaquatic species</p>"}],"displayNumber":"9"}]},{"id":"98526bc2-8592-41a0-bbe3-4c4f5566f190","type":"chunk","items":[{"id":"d9478565-c2e9-4e88-899a-c4609082eae6","type":"mcq","stem":"<p>According to the text, in what year did Smith and team announce their findings?</p>","stimulus":"<p>Evan Smith and team studied blue diamonds, which are among the rarest gemstones on Earth. An element called boron gets trapped in these gemstones&rsquo; crystal structures during formation. This element gives the diamonds their blue color. The team announced their findings in <span data-ssml-say-as=\"date\">2018</span>. They said the blue diamonds they studied formed much deeper in Earth&rsquo;s mantle than most other diamonds.</p>","answerOptions":[{"id":"303697e1-549e-4077-a7d9-ed4b884e1a2b","content":"<p><span data-ssml-say-as=\"date\">2021</span></p>"},{"id":"91bd5947-5991-4091-abb8-c7516c28ba7a","content":"<p><span data-ssml-say-as=\"date\">2020</span></p>"},{"id":"2324f4b9-11a9-4d56-8e18-ec999f3d5dd1","content":"<p><span data-ssml-say-as=\"date\">2018</span></p>"},{"id":"81137d94-8478-4b11-9c12-87202ccca1b7","content":"<p><span data-ssml-say-as=\"date\">2019</span></p>"}],"displayNumber":"10"}]},{"id":"77c81e4b-84fb-4f87-806b-deca4bb0879a","type":"chunk","items":[{"id":"2872554a-f186-4c9f-892f-cc98eefe53e8","type":"mcq","stem":"<p>Which choice best states the main topic of the text?</p>","stimulus":"<p>Country music began rising in popularity in the early 1900s largely because of AM radio. Country music radio shows helped launch the careers of many country stars. One of the most influential shows was the <em>Grand Ole Opry</em>, broadcast from Nashville, Tennessee. Dottie West sang her hit song &ldquo;Country Sunshine&rdquo; on the show. AM radio helped transform country music into a nationwide sensation and made country icons like West household names.</p>","answerOptions":[{"id":"7b21b04d-368a-485b-8dde-7d286c04e656","content":"<p>The history of the <em>Grand Ole Opry&nbsp;</em>radio show</p>"},{"id":"f4f31905-9e7e-483c-aada-26a8e32b0353","content":"<p>Performances by Dottie West in Nashville during the 1900s</p>"},{"id":"5a1edb4d-a94e-4073-bb8b-3c2f8e9fbad2","content":"<p>New types of musical instruments used by country music performers</p>"},{"id":"8c65fa79-a589-476a-96d7-a2467f65c13e","content":"<p>How AM radio helped country music rise in popularity</p>"}],"displayNumber":"11"}]},{"id":"84d75f40-bb3d-4966-b55b-e63a2dc3edd9","type":"chunk","items":[{"id":"8ae6dc4f-7bd2-446e-9c5b-c5260f201605","type":"mcq","stem":"<p>Which statement about Shygirl is best supported by the text?</p>","stimulus":"<p>Many artists associated with hyperpop, a movement in electronic music that emerged in the 2010s, conform to the model perfected by the American duo 100 gecs: bold synthesizer arrangements, propulsive beats, and electronically manipulated vocals. Yet the movement is hardly uniform: British recording artist Shygirl incorporates R&amp;B vocal stylings into the hyperpop sound, for example. Such stylistic diversity is encouraged in part by the music-streaming app Spotify, whose curated playlist of hyperpop songs balances cohesion with variety.</p>","answerOptions":[{"id":"b1a0abe4-41a3-4124-9f2c-159b9e43fd71","content":"<p>While some of her recordings conform to the model perfected by 100 gecs, others reject it outright.</p>"},{"id":"4095864e-e007-493e-9dc5-9f267ee82c86","content":"<p>She developed her unique sound without being influenced by other artists on Spotify&rsquo;s hyperpop playlist.</p>"},{"id":"6733ed14-1bca-470d-afbb-648771bcdc59","content":"<p>Her inclusion on Spotify&rsquo;s hyperpop playlist inspired established artists to embrace stylistic experimentation.</p>"},{"id":"abda8d9b-f95a-4395-9b89-845fb62d2d25","content":"<p>Her music diverges from the typical hyperpop sound but doesn&rsquo;t abandon it.</p>"}],"displayNumber":"12"}]},{"id":"f5aaef72-59a6-4921-97a0-8f40fd0c03bd","type":"chunk","items":[{"id":"0a34fe43-cf67-46e1-84af-5789466b7228","type":"mcq","stem":"<p>Which choice most effectively uses data from the table to complete the statement?</p>","stimulus":"<p><figure class=\"table\"><table class=\"gdr\"><caption style=\"caption-side: top;\"><p style=\"text-align: center;\">Average Microplastic Density in Samples from Four Bodies of Water</p></caption><thead><tr><th scope=\"col\" style=\"text-align: center;vertical-align: bottom;\">Body of water</th><th scope=\"col\" style=\"text-align: center;vertical-align: bottom;\">Microplastic density (pieces per cubic meter)</th></tr></thead><tbody><tr><th scope=\"row\" style=\"text-align: left;\">English Channel</th><td style=\"text-align: center;\">0.2</td></tr><tr><th scope=\"row\" style=\"text-align: left;\">Gulf of California</th><td style=\"text-align: center;\">0</td></tr><tr><th scope=\"row\" style=\"text-align: left;\">Celtic Sea</th><td style=\"text-align: center;\">38.3</td></tr><tr><th scope=\"row\" style=\"text-align: left;\">Mediterranean Sea</th><td style=\"text-align: center;\">3.1</td></tr></tbody></table></figure></p>\n<p>Microplastic pollution is found all around the world. Looking at data for four bodies of water, a student determines that the one with the greatest density of microplastics is the <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span></p>","answerOptions":[{"id":"03cb320c-50bf-445f-9e2b-3280e9d96fe5","content":"<p>Celtic Sea.</p>"},{"id":"e87d921a-7bf9-41e6-92f3-577619b9c6c1","content":"<p>English Channel.</p>"},{"id":"8630a6bc-1f69-4ca3-ae8a-928834d00d71","content":"<p>Mediterranean Sea.</p>"},{"id":"72faaa27-f01b-4a70-b58d-6a7ef1c87257","content":"<p>Gulf of California.</p>"}],"displayNumber":"13"}]},{"id":"488da7ae-2826-4472-a241-3c546ce0b636","type":"chunk","items":[{"id":"e7ff53a2-5724-4c96-a854-fd39c4b0a646","type":"mcq","stem":"<p>Which choice most effectively uses data from the table to complete the example?</p>","stimulus":"<p><figure class=\"table\"><table class=\"gdr\"><caption style=\"caption-side: top;\"><p style=\"text-align: center;\">Highest-Grossing Films in a Language Other than English at US Box Office</p></caption><thead><tr><th scope=\"col\" style=\"text-align: center;vertical-align: bottom;\">Title</th><th scope=\"col\" style=\"text-align: center;vertical-align: bottom;\">Lifetime gross earnings</th><th scope=\"col\" style=\"text-align: center;vertical-align: bottom;\">Opening weekend box office gross earnings</th><th scope=\"col\" style=\"text-align: center;vertical-align: bottom;\">US release date</th><th scope=\"col\" style=\"text-align: center;vertical-align: bottom;\">Director</th><th scope=\"col\" style=\"text-align: center;vertical-align: bottom;\">Oscar nominated?</th></tr></thead><tbody><tr><th scope=\"row\" style=\"text-align: left;\"><em>Am&eacute;lie</em></th><td style=\"text-align: center;\">$33,225,499</td><td style=\ "stimulus":"<p>Ships in the British Royal Navy during the Napoleonic Wars (<span data-ssml-say-as=\"date\">1803</span>&ndash;<span data-ssml-say-as=\"date\">1815</span>) were ranked based on military strength. The system considered the number of a ship&rsquo;s cannons and decks. &ldquo;First-rate&rdquo; was the highest ranking, and &ldquo;sixth-rate&rdquo; was the lowest ranking, followed by unranked ships. The size of a ship&rsquo;s crew was based on this ranking: first-rate ships had between 850 and 875 crewmen, while lower-ranked ships had fewer. Three of the ships in the British Royal Navy were the <em>Waterloo</em> (80 cannons and two decks), the <em>Union</em> (98 cannons and three decks), and the <em>Royal George</em> (120 cannons and three decks). Among these, only the <em>Royal George</em> was a first-rate ship. It can therefore be concluded that <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span></p>","answerOptions":[{"id":"03cd4d1a-f415-4e7e-85bd-a8b7c0295665","content":"<p>the <em>Union</em> had between 850 and 875 crewmen, but the <em>Waterloo</em> and the <em>Royal George</em> each had fewer than 850 crewmen.</p>"},{"id":"b1e03b6c-cdd0-438a-9ecd-b8fb7389d939","content":"<p>all ships with three decks were ranked as first-rate ships.</p>"},{"id":"af47c915-e134-4b98-9c42-76ebf5b020b6","content":"<p>the <em>Waterloo</em> had a smaller crew than the <em>Royal George</em><em>.</em></p>"},{"id":"e931303d-a9da-4931-98b7-2376d37aedec","content":"<p>the&nbsp;<em>Royal George</em>&nbsp;needed a crew larger than 875 people in order to operate efficiently.</p>"}],"displayNumber":"15"}]},{"id":"bda167da-0fbe-4b14-9f45-e66068323f14","type":"chunk","items":[{"id":"ed9a8eb9-60e0-4768-affd-05543763a938","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>Though they are in different countries, the cities of Nueva Loja, Ecuador, and Macapa, Brazil, do have something in common. They are among the rare <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> sit almost directly on the equator.</p>","answerOptions":[{"id":"22cbc53a-229c-4cf3-aa62-15235c4efbee","content":"<p>places that</p>"},{"id":"276f336e-2e41-421b-9efd-c1679b8d4cb2","content":"<p>places<span data-ssml-say-as=\"characters\">.</span> That</p>"},{"id":"e8a7a337-8797-414e-bbb0-b3227be35c15","content":"<p>places<span data-ssml-say-as=\"characters\">:</span> that</p>"},{"id":"f3c0708e-5041-4ec3-ad03-6f3e2afd548a","content":"<p>places in that</p>"}],"displayNumber":"16"}]},{"id":"1c45b91f-e235-4eb2-abdb-2d7409fdd712","type":"chunk","items":[{"id":"be80bdf1-2e8c-4e3d-9b80-edc90f9d7c8d","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>The utility of the FTSE All-Share Index, which calculates the total value of a portfolio of stocks traded on the UK stock market, is twofold: first, <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> the stock values into a single number, it offers a simple metric by which investors can easily track and compare market performance quarter to quarter; second, its diversified basket of stocks can be replicated in the form of an index fund, thus turning over 550 different stocks into a single tradable asset.</p>","answerOptions":[{"id":"6a1c8add-2847-48b5-a0a3-02a019c70b9f","content":"<p>to condense</p>"},{"id":"0a7b08e3-abec-4cc5-8fbf-f1e73022553c","content":"<p>in condensing</p>"},{"id":"05cc2465-7edd-47f7-8753-0753cecb4b8d","content":"<p>they condense</p>"},{"id":"45ea05f3-b4fe-4c80-9250-3763ba91cfc8","content":"<p>it condenses</p>"}],"displayNumber":"17"}]},{"id":"a0999ed0-b41b-4cd1-ace0-f5357595d3e0","type":"chunk","items":[{"id":"86ed3640-5782-4a86-9d13-22bb280b2178","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>Ca

\"sr-only\">blank</span> other words, when pecan oil is heated past this temperature, it will begin to combust and emit smoke.</p>","answerOptions":[{"id":"ef497c50-7a9a-4bdc-8344-01ac9e672e9e","content":"<p>Fahrenheit in</p>"},{"id":"68dcbf12-a293-4903-877e-31d09b5a2dde","content":"<p>Fahrenheit<span data-ssml-say-as=\"characters\">.</span> In</p>"},{"id":"ce869808-6f0b-4424-84dd-dbaea606d770","content":"<p>Fahrenheit and in</p>"},{"id":"9235369a-fcc6-4429-ae86-856cbf7877e8","content":"<p>Fahrenheit <span data-ssml-say-as=\"characters\">(</span>in</p>"}],"displayNumber":"20"}]},{"id":"0f3f06c1-dfb4-4ad0-898c-616fcc712560","type":"chunk","items":[{"id":"5fd6b64f-a9f6-4123-8bb5-c638f883aff3","type":"mcq","stem":"\n<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>On entering the produce section of the grocery store, the perfumer <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> not just the general scent of fruit but the distinct olfactory nuances of amanatsu (<em>Citrus natsudaidai</em>), bolwarra (<em>Eupomatia laurina</em>), and scarlet firethorn (<em>Pyracantha coccinea</em>).</p>\n","answerOptions":[{"id":"94a66c26-7c14-43c4-b2c2-39a594d01405","content":"<p>to distinguish</p>"},{"id":"42e26ffa-4179-4625-b896-9b71311b29ff","content":"<p>distinguish</p>"},{"id":"99b9fb23-8a8c-4d53-b765-a9063c5146fa","content":"<p>distinguishing</p>"},{"id":"e7b3db55-3449-4371-9bcc-16edd2f30360","content":"<p>distinguished</p>"}],"displayNumber":"21"}]},{"id":"e41ce2f4-b1b7-422b-b3cc-448b23a5cb90","type":"chunk","items":[{"id":"823f10ac-ea25-4b7c-b858-e954d19c5419","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>In New York City, the Museum of Modern Art&rsquo;s collection of oil paintings <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> Arbit Blatas&rsquo;s <em>Three Children</em> (<span data-ssml-say-as=\"date\">1938</span>), David Webster&rsquo;s <em>Cerebellar Islands</em> (<span data-ssml-say-as=\"date\">1999</span>), and many other celebrated works.</p>","answerOptions":[{"id":"a9d294de-f17a-42ea-8f58-67b2176aa553","content":"<p>includes<span data-ssml-say-as=\"characters\">:</span></p>"},{"id":"694d2cc9-6c3a-4df4-b78e-bf83635c4f23","content":"<p>includes</p>"},{"id":"cf413c73-b98d-4af9-ba6b-6c41dd234879","content":"<p>includes<span data-ssml-say-as=\"characters\">,</span></p>"},{"id":"5153108d-7f3c-49c5-a212-17a594ad4d45","content":"<p>includes<span data-ssml-say-as=\"characters\">;</span></p>"}],"displayNumber":"22"}]},{"id":"12990144-1175-4ac2-ac82-8b2deae5d6d9","type":"chunk","items":[{"id":"dd149fdb-a9aa-4f0a-9e7b-45caa98ad61f","type":"mcq","stem":"<p>The student wants to say when red-spotted swallowtail butterflies are most active. Which choice best uses information from the notes to do this?</p>","stimulus":"<p><p>A student has taken these notes:</p>\n<ul>\n<li>Red-spotted swallowtail butterflies are black with red spots.</li>\n<li>They are most active during the day.</li>\n<li>They eat nectar from flowers.</li>\n</ul></p>","answerOptions":[{"id":"16c7c47c-3a7c-4dd5-b45c-d87583e97e8d","content":"<p>Some butterflies are black with red spots.</p>"},{"id":"0fcac018-5529-4317-b017-4540bbe74330","content":"<p>Red-spotted swallowtail butterflies are most active during the day.</p>"},{"id":"bc41f6f5-d2d6-4083-824d-66a89f20d899","content":"<p>Red-spotted swallowtail butterflies eat nectar from flowers.</p>"},{"id":"3ec19cec-5ab4-49c8-98ea-09e5661c4fa3","content":"<p>The red-spotted swallowtail butterfly is a kind of insect.</p>"}],"displayNumber":"23"}]},{"id":"e4d2b29e-1732-4188-a5d9-c6c3c31a7755","type":"chunk","items":[{"id":"8a4af086-fc69-45dd-866f-3cd3cc9016dd","type":"mcq","stem":"<p>The student wants to describe what the band&rsquo;s members wear. Which choice best uses information from the notes to do this?</p>","stimulus":"<p><p>A student has taken these notes:</p>\n<ul>\n<li>The Marching Bronco ’Xpress is the marching band at Fayetteville State University (<span data-ssml-say-as=\"characters\">FSU</span>).</li>\n<li>Members of the band wear uniforms.</li>\n<li>The uniforms are blue, gray, and white.</li>\n</ul></p>","answerOptions":[{"id":"2c06c687-e3e3-4a79-afa6-f5a7c7801cdc","content":"<p>The Marching Bronco ’Xpress was founded in 1939.</p>"},{"id":"7dc21913-4284-47b5-99f0-a153c3fe8bfa","content":"<p><span data-ssml-say-as=\"characters\">FSU</span>&rsquo;s marching band is called the Marching Bronco ’Xpress.</p>"},{"id":"6960a51a-cba1-4ef8-9450-74d302740a01","content":"<p><span data-ssml-say-as=\"characters\">FSU</span> has a marching band.</p>"},{"id":"ac52a932-9032-450b-8d81-fa4d977f34a8","content":"<p>Members of the Marching Bronco ’Xpress wear blue, gray, and white uniforms.</p>"}],"displayNumber":"24"}]},{"id":"c78e3471-f5ad-4ce1-b05a-f2f871f2dd15","type":"chunk","items":[{"id":"8e45aa30-af10-4ebf-a5e3-39645667cde7","type":"mcq","stem":"<p>The student wants to begin a narrative about the Sons of Africa. Which choice most effectively uses relevant information from the notes to accomplish this goal?</p>","stimulus":"<p><p>While researching a topic, a student has taken the following notes:</p>\n<ul>\n<li>The Sons of Africa was a British abolitionist group founded in the late eighteenth century that&nbsp;consisted of formerly enslaved Africans who had gained their freedom.</li>\n<li>It was the first Black political organization in British history.</li>\n<li>It was cofounded by Olaudah Equiano and Ottobah Cugoano.</li>\n<li>Its members included George Wallace, James Bailey, Jasper Goree, and roughly a dozen others.</li>\n<li>The group&rsquo;s members advocated for abolition by giving public speeches, organizing petitions, and persuading legislators to pass antislavery bills.</li>\n<li>Their actions contributed to the abolition of the British slave trade in <span data-ssml-say-as=\"date\">1807</span>.</li>\n</ul></p>","answerOptions":[{"id":"dc257157-af19-4854-8e85-190d4ca1d0ac","content":"<p>After years of speeches, petitions, and persuading legislators, the group accomplished its mission&mdash;the British slave trade was abolished in <span data-ssml-say-as=\"date\">1807</span>.</p>"},{"id":"f7a9b446-1222-4c3c-9a00-abe16240fa04","content":"<p>In the late eighteenth century, a group of formerly enslaved British Africans would become the first Black political organization in British history&mdash;the Sons of Africa.</p>"},{"id":"e6442407-61a0-4a45-8d5a-662010c44cae","content":"<p>Wallace, Bailey, and Goree were all formerly enslaved Africans who had gained their freedom; Equiano was the cofounder of the first Black political organization in British history.</p>"},{"id":"e53b969d-62c5-49aa-9a79-6e160caa35d6","content":"<p>Political change does not come easy; it took years of speeches, petitions, and more by the group&rsquo;s members to bring about the <span data-ssml-say-as=\"date\">1807</span> end to the slave trade.</p>"}],"displayNumber":"25"}]},{"id":"17a9119b-750e-4d96-a22c-e49cf453505f","type":"chunk","items":[{"id":"fe6a1edf-4303-419b-91c0-e13ee219b42e","type":"mcq","stem":"<p>The student wants to describe the format of &ldquo;4 haiku (for Eugene Redmond).&rdquo; Which choice most effectively uses relevant information from the notes to accomplish this goal?</p>","stimulus":"<p>While researching a topic, a student has taken the following notes:</p>\n<ul>\n<li>The poem &ldquo;4 haiku (for Eugene Redmond)&rdquo; is by African American writer Sonia Sanchez.</li>\n<li>It was published in her 2010 poetry book entitled <em>Morning Haiku</em>.</li>\n<li>The poem is written as a sequence of four haiku.</li>\n<li>According to the book&rsquo;s publisher, Penguin Random House (PRH), the book &ldquo;celebrates the gifts of life and mourns the deaths of revered African American figures.&rdquo;</li>\n<li>According to Sanchez, she chose to write in the form of haiku because it helps &ldquo;maintain memory and dignity.&rdquo;</li>\n</ul>","answerOptions":[{"id":"d61aa488-4307-45b7-907e-50d2c21364f3","content":"<p>The poems in <em>Morning</em> <em>Haiku</em> (2010) are each written as a sequence of haiku.</p>"},{"id":"8de5fbf1-304c-4866-bac0-616573f6b024","content":"<p>Sanchez chose the form used in the poem &ldquo;4 haiku (for Eugene Redmond)&rdquo; because it helps &ldquo;maintain memory and dignity.&rdquo;</p>"},{"id":"cb9415da-4924-4162-9b87-be45fe457cf6","content":"<p>The poem &ldquo;4 haiku (for Eugene Redmond)&rdquo; was published in the 2010 book <em>Morning Haiku</em>, which &ldquo;celebrates the gifts of life and mourns the deaths of revered African American figures.&rdquo;</p>"},{"id":"a740528c-36f5-4262-bb9a-291d628c2b1b","content":"<p>The poem &ldquo;4 haiku (for Eugene Redmond)&rdquo; is written as a sequence of four haiku.</p>"}],"displayNumber":"26"}]},{"id":"2add0a71-7f50-473d-b890-c9ff79e57db6","type":"chunk","items":[{"id":"a953369f-c130-43e8-aeb9-dbd404e06690","type":"mcq","stem":"<p>The student wants to describe Aatchim&rsquo;s artistic process. Which choice most effectively uses relevant information from the notes to accomplish this goal?</p>","stimulus":"<p>While researching a topic, a student has taken the following notes:</p>\n<ul>\n<li>Joeun Kim Aatchim is a Korean-born, New York&ndash;based visual artist.</li>\n<li>She has a condition known as stereo blindness, which means her eyes don&rsquo;t fully sync to form an image.</li>\n<li>Rather than drawing subjects while looking at them, she relies on an accumulation of visual memory.</li>\n<li>Her drawings feature transparent, overlapping images of their subjects and thus have a hazy appearance.</li>\n<li><em>Transparency</em> (2019) features a woman shown from several perspectives.</li>\n<li><em>Two Mini Lilies</em> (2019) features a pair of lilies in separate glass vases.</li>\n</ul>","answerOptions":[{"id":"3081a5b7-7c80-4e50-ba04-c22eec152679","content":"<p>Aatchim&rsquo;s drawings, created from visual memory, feature transparent, overlapping images of their subjects.</p>"},{"id":"6e494c53-3549-425f-8be8-f615505f8b9a","content":"<p>Aatchim, who has stereo blindness, doesn&rsquo;t draw while looking at her subjects, relying instead on an accumulation of visual memory.</p>"},{"id":"d0c50eff-b44b-4aee-9dcf-501279b3c771","content":"<p>The Korean-born, New York&ndash;based Aatchim drew <em>Transparency</em> in 2019; depicted in the drawing is a woman shown from several perspectives.</p>"},{"id":"1414d857-c297-4efa-959d-895b6fa086e7","content":"<p>Aatchim, whose drawing <em>Two Mini Lilies</em> features a pair of lilies in separate glass vases, has stereo blindness, which means her eyes don&rsquo;t fully sync to form an image.</p>"}],"displayNumber":"27"}]}],"calculatorAdvantage":["None"],"defaultDuration":32,"enableTts":false},{"id":"e9a5fa41-7d1c-40e2-b23f-dca29b10e899","type":"destination","title":"Section 1, Module 2: Reading and Writing","instructions":"<p class=\"dap_body\">The questions in this section address a number of important reading and writing skills. Each question includes one or more passages, which may include a table or graph. Read each passage and question carefully, and then choose the best answer to the question based on the <span class=\"tts-container\" ssml-label=\"Substitution\" data-ssml-sub-alias=\"passage or passages\">passage(s)</span>.&nbsp;</p><p class=\"dap_body\">All questions in this section are multiple-choice with four answer choices. Each question has a single best answer.</p>","duration":32,"navigateBack":"yes","holdStudentAtEnd":true,"useSectionEndRoom":true,"enableAnnotationsTool":true,"breakAfter":{"duration":10,"studentAdvanced":true},"chunks":[{"id":"eb4b3ba7-fa9b-441b-8e99-44dcce877b90","type":"chunk","items":[{"id":"aab367e1-8b17-4fae-9f61-bc89332e408d","type":"mcq","stem":"<p>Which choice completes the text with the most logical and precise word or phrase?</p>","stimulus":"<p>Corn&rsquo;s diffusion toward the Meskwaki people was geographically and temporally <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span>: as with other varieties developed by eastern North American tribes, the ancestry of the Meskwakis&rsquo; corn extends to Southwestern corn populations, including one grown in New Mexico circa <span data-ssml-say-as=\"date\">1375</span> BCE, to older populations in northern Mexico, and finally to southern Mexico, where corn was domesticated circa 7000 BCE.</p>","answerOptions":[{"id":"15e6bfdc-015d-4b3f-ab3a-7dd9fc63f011","content":"<p>opaque</p>"},{"id":"19794883-2775-469b-9c0e-ab7c9c628575","content":"<p>idiosyncratic</p>"},{"id":"c4273d33-3a25-409e-9738-3e098085dc62","content":"<p>volatile</p>"},{"id":"0adf910e-d645-4953-a0a6-c04a9504c26c","content":"<p>incremental</p>"}],"displayNumber":"1"}]},{"id":"3f2437ae-52af-4ec2-9476-b2b156bd4ac0","type":"chunk","items":[{"id":"0c262390-bf49-400a-851d-0cda5b886d33","type":"mcq","stem":"<p>Which choice completes the text with the most logical and precise word or phrase?</p>","stimulus":"<p>Palenque, the famed Maya city located in the highlands of southeastern Mexico, was likely <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> of achievements attained in the lesser-known polities of the Mirador Basin. As Morales-Aguilar <span data-ssml-sub-alias=\"et al\">et al.</span> have shown, developments at those earlier Mirador sites (<span data-ssml-sub-alias=\"e g\">e.g.</span>, the eight astronomically aligned complexes at Balamnal) were a historical precondition for the sophistication exhibited by the architects of later cities.</p>","answerOptions":[{"id":"3520809c-8743-49d8-9f69-ebeeec601f5f","content":"<p>an antithesis</p>"},{"id":"56e8ccfc-d673-4045-b353-2d87746ad502","content":"<p>an archetype</p>"},{"id":"2fa093a8-feac-42f9-99af-2ae7fe6dd048","content":"<p>a beneficiary</p>"},{"id":"9c7799cd-06de-4f43-ba58-32b4fbb5c7be","content":"<p>a replica</p>"}],"displayNumber":"2"}]},{"id":"6f1f19c5-1eee-46a5-bc56-19ff5c011a3f","type":"chunk","items":[{"id":"eb976977-134c-4c30-9bc1-6375be5700e9","type":"mcq","stem":"<p>Which choice completes the text with the most logical and precise word or phrase?</p>","stimulus":"<p>Artists affiliated with the Judson Dance Theater in the 1960s were dancers (including Sally Gross) and creators from other fields (such as painter Alex Hay) interested in redefining the concept of dance. Rejecting formal techniques, the group <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> everyday movements: many pieces were built around ordinary actions, like walking.</p>","answerOptions":[{"id":"6cf73881-8714-4e13-828e-6430918f0a08","content":"<p>foregrounded</p>"},{"id":"7f828c7e-6854-488a-a617-d797259f479b","content":"<p>contrived</p>"},{"id":"9e89c935-a32d-49b5-b092-92fcca52ef7d","content":"<p>amended</p>"},{"id":"723f67b5-0578-4cd3-8103-ea11f2d14114","content":"<p>repudiated</p>"}],"displayNumber":"3"}]},{"id":"d7c301d1-2cec-4235-bcb3-2ae400123818","type":"chunk","items":[{"id":"b3e2063b-bcfe-47aa-8e05-a2675a42d177","type":"mcq","stem":"<p>Which choice completes the text with the most logical and precise word or phrase?</p>","stimulus":"<p>Quantitative analysis of vast historical data sets and other tools of abstraction allow historians to examine broad phenomena, but such methods <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> the particularity of individual actors. By focusing on singular individuals and incidents in exhaustive detail, Emma Rothschild&rsquo;s <em>The Inner Life of Empires</em> and other microhistories aim to show how broader phenomena were experienced at a human level.</p>","answerOptions":[{"id":"9fb11743-ce9f-45d3-9f32-9a06db69e39d","content":"<p>preempt</p>"},{"id":"85535e48-8b31-4c22-9379-edbe780070ce","content":"<p>efface</p>"},{"id":"1b264e75-f1f4-4965-8b2e-28ec17a88252","content":"<p>misconstrue</p>"},{"id":"fbdaeca0-e486-48e5-b7f9-bcf1cd4b1549","content":"<p>accentuate</p>"}],"displayNumber":"4"}]},{"id":"1505d588-955b-4c17-a90c-9f8dfa13eef3","type":"chunk","items":[{"id":"ed21bf32-2ec3-47c2-8068-d6d2233b009a","type":"mcq","stem":"<p>Which choice best states the main purpose of the text?</p>","stimulus":"<p>John <span data-ssml-sub-alias=\"A\">A.</span> Finarelli and Anjali Goswami examined potential associations between encephalization (increase in brain size relative to body size) and ocular orbit positioning in sixty-eight mammalian carnivore species from extant and extinct lineages. Whereas the researchers&rsquo; analysis revealed no consistent links between encephalization and orbital geometry across the order Carnivora, within certain families patterns emerged; for example, Canidae, which includes the species <em>Vulpes vulpes</em>, exhibited significant negative correlations between encephalization and convergence (how forward-facing orbits are).</p>","answerOptions":[{"id":"d043320d-1087-4b3f-9bbb-450cfcc09f16","content":"<p>To explain how relationships between brain size and orbital geometry in specific carnivoran families differ from the prevalent patterns found in other carnivoran lineages</p>"},{"id":"a48f7411-be87-4346-95b1-002436f94e06","content":"<p>To describe study findings suggesting that relationships between brain size and orbit orientation are specific to taxonomic subgroups rather than universal across carnivorans</p>"},{"id":"6545594d-c980-42ac-9e74-79eb121b0081","content":"<p>To present evidence that orbit orientation varies across carnivoran species in correlation with different encephalization rates, with particularly notable patterns in certain taxonomic subgroups</p>"},{"id":"bd644a93-fb7e-4a49-8efe-fff55f7de9d2","content":"<p>To demonstrate how a comprehensive analysis of orbital geometry revealed a pattern of encephalization within a specific carnivoran lineage</p>"}],"displayNumber":"5"}]},{"id":"e8c826eb-2466-4d34-85f4-eeca3e44f2f4","type":"chunk","items":[{"id":"9c72ad0a-0228-43fa-8806-d1234b704245","type":"mcq","stem":"<p>Which choice best describes the function of the underlined portion in the text as a whole?</p>","stimulus":"<p>The following text is adapted from Rohinton Mistry&rsquo;s 2002 novel <em>Family Matters</em>. Nariman&rsquo;s family is visiting him in his flat (apartment).</p>\n<blockquote>\n<p>[Nariman&rsquo;s] spirits were rising with each passing minute. The joy and laughter and youth [his family] brought was an antidote to the sombreness enveloping his flat, the hours when he felt the very walls and ceilings were encrusted with the distress of unhappy decades. The furniture too, of teak and rosewood, <span style=\"text-decoration: underline;\" role=\"region\" aria-label=\"Referenced Content\">the huge armoires and four-poster beds looming darkly, glum hulks waiting for some dreaded end</span>, seemed once again welcoming and hospitable. And that long row of family portraits in the passageway&mdash;today their dour grimaces seemed comical.</p>\n</blockquote>\n<p style=\"text-align: right;\"><span class=\"dap_copyright\">&copy;2002 by Rohinton Mistry</span></p>","answerOptions":[{"id":"6509ded4-27b8-4cf5-9494-c4ca2ffab075","content":"<p>To create a sense of misgiving regarding Nariman&rsquo;s future</p>"},{"id":"181dffd3-819f-41a8-a305-eebc8288fc7c","content":"<p>To illustrate the bleakness with which Nariman typically views his surroundings</p>"},{"id":"6699d1f7-3984-4017-bddc-b35f1d36866f","content":"<p>To claim that the furniture symbolizes the feelings of melancholy Nariman experienced in the past</p>"},{"id":"000ed9cb-91f6-4efb-b8e7-c73a64d6fbe8","content":"<p>To hint that Nariman would prefer to live in a different place with a more pleasant atmosphere</p>"}],"displayNumber":"6"}]},{"id":"28c892f8-fbda-4dca-b47c-45632b6feda0","type":"chunk","items":[{"id":"a74ae63f-1e30-4cb8-98be-8384e1914273","type":"mcq","stem":"<p>Which choice best describes the function of the underlined portion in the text as a whole?</p>","stimulus":"<p>Visiting flowers that produce high volumes of nectar allows hummingbirds, including lesser violetears, to maximize their foraging efficiency. But nectar can&rsquo;t be seen from outside the flower, and while <span style=\"text-decoration: underline;\" role=\"region\" aria-label=\"Referenced Content\">some studies have suggested that petal length may indicate nectar volume</span>, Mar&iacute;a <span data-ssml-sub-alias=\"A\">A.</span> Maglianesi and team found no such association among hummingbird-visited plants at Los Gigantes Ecological Trail and other sites in Costa Rica. The researchers hypothesize that by driving hummingbirds to visit more plants in search of high-reward flowers, plants&rsquo; lack of reliable signaling may increase chances of pollination.</p>","answerOptions":[{"id":"27a502ef-eeb0-4660-ae7f-9724c971a9b2","content":"<p>It acknowledges research findings, which weren&rsquo;t replicated by the study discussed later in the text, positing a relationship between floral traits that potentially underlies hummingbird foraging decisions.</p>"},{"id":"9609ad0f-d848-4aff-91a7-3087fb37e7bd","content":"<p>It attributes the inconclusive findings reported in the text regarding the influence of a particular floral trait on interactions between hummingbirds and plants to differences in study sites.</p>"},{"id":"c1001ecf-b64a-4857-8a7d-c3be329d164d","content":"<p>It suggests that a hypothesis discussed later in the text regarding a potential visual cue that hummingbirds rely on to increase their foraging efficiency has little support from the broader scientific community.</p>"},{"id":"edf7a793-47cd-44fc-b074-705eab18ec0e","content":"<p>It summarizes contradictory study findings concerning a floral trait that influences hummingbird foraging patterns, which the study mentioned later in the text aimed to resolve.</p>"}],"displayNumber":"7"}]},{"id":"825f7fea-ff39-4d06-898b-afbb2f1c88da","type":"chunk","items":[{"id":"c4c79d37-3ccc-44bc-ac3f-2b90a28414d6","type":"mcq","stem":"<p>Which choice best describes the function of the underlined portion in the text as a whole?</p>","stimulus":"<p>The Ganges–Brahmaputra Delta Aquifer in Bangladesh is among many coastal aquifers that are vulnerable to saltwater intrusion due to groundwater overexploitation and sea level rise. In some settings, engineers employ managed aquifer recharge (MAR), injecting water at strategic sites to raise groundwater pressure. <span style=\"text-decoration: underline;\" role=\"region\" aria-label=\"Referenced Content\">Due to its greater density, seawater forms a wedge beneath fresh water;</span> thus, even small increases in groundwater pressure can shift the interface seaward. MAR utilizes this phenomenon to create a hydraulic barrier that holds the wedge back, preventing landward movement that could contaminate supply wells.&nbsp;</p>","answerOptions":[{"id":"f10d4ba1-6dc6-4fbc-afe7-e522702c75db","content":"<p>It describes an effect of a difference in physical properties that is exploited by the method explained by the text.</p>"},{"id":"491d0c54-484d-458c-9188-fb1646aede99","content":"<p>It establishes a specific set of conditions that contributes to the environmental problem identified at the beginning of the text.</p>"},{"id":"b0cbc52d-a591-4b84-a081-922440ea3809","content":"<p>It introduces a naturally occurring phenomenon that complicates the plan of corrective action outlined by the text.</p>"},{"id":"d838be15-b7b4-42be-baa1-0b7b4d08b92d","content":"<p>It offers a reason why the remediation technique discussed in the text is particularly appropriate in certain settings.&nbsp;</p>"}],"displayNumber":"8"}]},{"id":"d39ca274-a68d-4f3d-93f0-e67200ec2350","type":"chunk","items":[{"id":"2cd41ef9-4013-4705-b390-77b9271ae453","type":"mcq","stem":"<p>Information in the text best supports which statement about the essay &ldquo;The Senate&rdquo;?</p>","stimulus":"<p>The Federalist Papers are a collection of 85 essays written by Alexander Hamilton, John Jay, and James Madison. Their publication (under a single pen name) was divided among the <em>Daily Advertiser</em> and other New York newspapers in 1787&ndash;88. The essays argue that New Yorkers should vote to ratify the proposed United States Constitution. Though the authorship of most of the individual essays is certain, that of a few is in question: for instance, while No. 15, &ldquo;The Insufficiency of the Present Confederation to Preserve the Union,&rdquo; was surely penned by Hamilton, No. 62, &ldquo;The Senate,&rdquo; may have been written by either Hamilton or Madison.</p>","answerOptions":[{"id":"e3671eb5-d7b1-46e2-9126-3a632623316c","content":"<p>It was a collaborative effort between Alexander Hamilton and James Madison.</p>"},{"id":"e3153895-8d05-483a-b67a-35d8cab8c1b1","content":"<p>It was written by one of two of the authors of the Federalist Papers, but which one has not been determined.</p>"},{"id":"c94ebc47-279b-4f6b-813a-6eeb6f8a694d","content":"<p>It was published in the <em>Daily Advertiser</em>.</p>"},{"id":"b18b766f-69d9-4cb5-a799-b8e0775dbdf5","content":"<p>It was penned by the person who authored the majority of the Federalist Papers.</p>"}],"displayNumber":"9"}]},{"id":"0dd14014-4dbe-4d19-8bb1-7f79c5005c8b","type":"chunk","items":[{"id":"41637136-af16-493e-ba7a-417fdc09ecab","type":"mcq","stem":"<p>Which choice best states the main idea of the text?</p>","stimulus":"<p>Synthetic elements with very heavy nuclei, such as darmstadtium (<span data-ssml-say-as=\"characters\">Ds</span>) and flerovium (<span data-ssml-say-as=\"characters\">Fl</span>), can exhibit behaviors that make these elements challenging to classify. The earliest experiment with <span data-ssml-say-as=\"characters\">Fl</span> revealed properties associated with noble gases, while a second experiment found that <span data-ssml-say-as=\"characters\">Fl</span> acts like a volatile metal. When Yakushev, Runke, <span data-ssml-sub-alias=\"et al\">et al.</span> studied interactions between <span data-ssml-say-as=\"characters\">Fl</span> and gold surfaces, they found that <span data-ssml-say-as=\"characters\">Fl</span> is less reactive than the volatile metal mercury but is more reactive than the noble gas radon. These results confirm that <span data-ssml-say-as=\"characters\">Fl</span> forms chemical bonds with gold, but the mechanisms of these reactions are unclear.</p>","answerOptions":[{"id":"35dccd1b-7d1f-471c-9ec6-1f35ab58b979","content":"<p>Although experiments have indicated that <span data-ssml-say-as=\"characters\">Fl</span> is similar to the noble gases, it is too reactive to belong to this class of elements.</p>"},{"id":"2a921ea1-c1dc-436c-89ba-5ea4503e4fcc","content":"<p>Experiments have shown that properties of <span data-ssml-say-as=\"characters\">Fl</span> do not precisely align with existing classifications of elements.</p>"},{"id":"410759ab-fea2-41ff-978e-f05df43a45c6","content":"<p>Observed inconsistencies in the behavior of <span data-ssml-say-as=\"characters\">Fl</span> across experiments can be attributed to its interactions with other elements with very heavy nuclei.</p>"},{"id":"037f0a23-444f-48a0-8ab0-f2d3f472754b","content":"<p>Although <span data-ssml-say-as=\"characters\">Fl</span> forms chemical bonds with gold surfaces in experiments, it does not react with volatile metals or noble gases.</p>"}],"displayNumber":"10"}]},{"id":"ad88d35b-a5d6-40dd-9f10-7c299bbb3f8a","type":"chunk","items":[{"id":"491be431-b991-4b6e-b46a-756d9576ea9f","type":"mcq","stem":"<p>Based on the text, which choice best describes how the approaches of Deren and Vertov differ?</p>","stimulus":"<p>Maya Deren&rsquo;s film <em>A Study in Choreography for Camera</em> (1945) presents Talley Beatty performing a dance that no human could ever perform live. At one point, Beatty stands outdoors on his right foot while reaching his left foot toward the right of the shot and then emerges left foot first from the left of the shot into a residential interior. The sequence&rsquo;s transparent impossibility serves to prompt viewers to consider the filmmaking techniques at work. Dziga Vertov&rsquo;s <em>Man with a Movie Camera</em> (1929), on the other hand, puts filmmaking techniques directly on screen; for instance, a shot of an urban area full of people is preceded by a shot of the camera being mounted atop a tall smokestack to capture the scene.</p>","answerOptions":[{"id":"ca93a6ba-ab2c-4f57-b6d0-2362651bddf0","content":"<p>Both filmmakers draw the audience&rsquo;s attention to the techniques of filmmaking, but Deren does so implicitly while Vertov does so explicitly.</p>"},{"id":"ad11a9c1-0da9-41ec-a387-7caabcc082d3","content":"<p>Both filmmakers emphasize the artificiality of the medium of film, but Deren revels in that artificiality while Vertov critiques it.</p>"},{"id":"dad6a887-342f-4c7d-916e-a7744530a833","content":"<p>Both filmmakers employ sophisticated techniques, but Deren uses those techniques to achieve an illusion of realism while Vertov challenges realistic representation.</p>"},{"id":"0b9d17d4-b60d-448f-9e3e-033397b47221","content":"<p>Both filmmakers present scenes that cannot take place in real life, but Deren suppresses how this was achieved while Vertov shows the scenes being filmed.</p>"}],"displayNumber":"11"}]},{"id":"0a9f2624-128c-42bb-b1a9-f33c6158ac01","type":"chunk","items":[{"id":"0ff83710-ef01-4be5-b11f-62f5210042a7","type":"mcq","stem":"<p>Which choice most effectively uses data from the graph to complete the assertion?</p>","stimulus":"<figure class=\"image\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"380\" height=\"542.250732421875\" viewBox=\"0 0 380 542.250732421875\" role=\"img\" aria-label=\"Bar graph titled Comparison of Bird Pecking Rates between Treatments. The horizontal axis is labeled Areas of orchard. 3 bars are shown. The vertical axis is labeled Damaged pears (percentage of total). It ranges from 0 to 14 necap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"70.703125\" y1=\"232.71428571428572\" x2=\"82.703125\" y2=\"232.71428571428572\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><text text-anchor=\"end\" transform=\"translate(64.703125 238.71428571428572)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">5</text><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"76.703125\" y1=\"250.57142857142858\" x2=\"365\" y2=\"250.57142857142858\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"70.703125\" y1=\"250.57142857142858\" x2=\"82.703125\" y2=\"250.57142857142858\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><text text-anchor=\"end\" transform=\"translate(64.703125 256.57142857142856)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">4</text><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"76.703125\" y1=\"268.42857142857144\" x2=\"365\" y2=\"268.42857142857144\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"70.703125\" y1=\"268.42857142857144\" x2=\"82.703125\" y2=\"268.42857142857144\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><text text-anchor=\"end\" transform=\"translate(64.703125 274.42857142857144)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">3</text><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"76.703125\" y1=\"286.2857142857143\" x2=\"365\" y2=\"286.2857142857143\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"70.703125\" y1=\"286.2857142857143\" \"#B3B3B3\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><text xmlns=\"http://www.w3.org/2000/svg\" x=\"0\" y=\"0\" text-anchor=\"end\" transform=\"translate(148.4010267857143 341.84) rotate(-40)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">Repeller with webcam</text><rect xmlns=\"http://www.w3.org/2000/svg\" x=\"200.25892857142858\" y=\"191.82142857142856\" height=\"130.17857142857144\" width=\"41.185267857142854\" fill=\"#B3B3B3\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><text xmlns=\"http://www.w3.org/2000/svg\" x=\"0\" y=\"0\" text-anchor=\"end\" transform=\"translate(230.77156250000002 341.84) rotate(-40)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">Continuous repeller</text><rect xmlns=\"http://www.w3.org/2000/svg\" x=\"282.6294642857143\" y=\"88.60714285714283\" height=\"233.39285714285717\" width=\"41.185267857142854\" fill=\"#B3B3B3\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><text xmlns=\"http://www.w3.org/2000/svg\" x=\"0\" y=\"0\" text-anchor=\"end\" transform=\"translate(313.1420982142857 341.84) rotate(-40)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">Control</text><text text-anchor=\"middle\" transform=\"translate(220.8515625 24)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">Comparison of Bird Pecking Rates</text><text text-anchor=\"middle\" transform=\"translate(220.8515625 48)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">between Treatments</text><text text-anchor=\"middle\" transform=\"translate(220.8515625 487.25064453125)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">Areas of orchard</text><rect xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" x=\"143.921875\" y=\"504.41064453125\" height=\"26.84\" width=\"153.859375\" stroke=\"#000000\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><rect xmlns=\"http://www.w3.org/2000/svg\" x=\"150.921875\" y=\"511.41064453125\" height=\"12\" width=\"12\" fill=\"#B3B3B3\" stroke=\"#000000\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><text transform=\"translate(169.921875 523.41064453125)\" text-anchor=\"top\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">pears damaged</text></g></svg></figure><div class=\"sr-only\" role=\"region\" aria-label=\"Long description for bar graph titled Comparison of Bird Pecking Rates between Treatments\"><ul>\n<li>The Damaged pears data for the 3 bars are as follows:\n<ul>\n<li>Repeller with webcam: 6.0%</li>\n<li>Continuous repeller: 7.3%</li>\n<li>Control: 13.1%</li>\n</ul>\n</li>\n</ul></div>\n<p>Robins and other pest birds can cause damage to sweet cherries and other fruits grown on farms by pecking at them and spoiling them. Aware of some practical limitations of scarecrows and other common deterrents, Qing Chen <span data-ssml-sub-alias=\"et al\">et al.</span> investigated the utility of an inexpensive, easily installed sonic bird repeller in a pear orchard. In one area the repeller emitted a sound continuously, while in another it emitted a sound only when triggered by a webcam linked to a neural network trained to recognize a pest bird&rsquo;s presence. (A third area without a repeller was used as a control condition.) Chen <span data-ssml-sub-alias=\"et al\">et al.</span> concluded that an intermittently active sonic repellent is more effective than one that is constantly active, as evidenced by the fact that <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span></p>","answerOptions":[{"id":"b6809ab9-5043-49bd-b0ce-26e54e33efd0","content":"<p>the greatest rate of damage to the pears occurred in the area of the orchard where no repeller was used.</p>"},{"id":"3d356d26-4e75-4bb8-91e3-b10e4989eeae","content":"<p>the rate of damage to the pears was approximately 6% in the area with the repeller attached to a neural network and approximately 7% in the area with the repeller not attached to a neural network.</p>"},{"id":"af4ad68d-f71a-4539-8326-3ae8a3b79a94","content":"<p>the lowest rate of damage occurred in the area of the orchard where the repeller was not attached to a neural network.</p>"},{"id":"608fd8f4-0d30-4765-b34b-b0e530c470b4","content":"<p>the rate of damage to the pears was approximately 7% in the area with the repeller attached to a neural network and approximately 13% in the area where no repeller was used.</p>"}],"displayNumber":"12"}]},{"id":"8c588247-14b7-457d-b59a-5da22cc5bcc7","type":"chunk","items":[{"id":"d8157ac8-3fb1-443a-8022-ec2c14a5d71a","type":"mcq","stem":"<p>Which choice most effectively uses data from the graph to complete the assertion?</p>","stimulus":"<figure class=\"image\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"400\" height=\"595.8312225341797\" viewBox=\"0 0 400 595.8312225341797\" role=\"img\" aria-label=\"Bar graph titled Percentages of Form 4720s Filed and Total Penalties Assessed on Private Foundations, by Taxable Activity, 2005. The horizontal axis has no label. Two data categories are shown. The vertical axis is labeled Percentage. It ranges from 0 to 90 in increments of 10. Refer to long description.\"><g id=\"ed420550-79eb-48d4-af01-cd27cdd08afd\" data-name=\"Layer 1\"><defs>\n      <pattern id=\"bar4\" x=\"0\" y=\"0\" width=\"10\" height=\"100\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(50)\">\n        <rect x=\"0\" y=\"0\" width=\"5\" height=\"100\" fill=\"#CDCDCD\"/>\n        <rect x=\"5\" y=\"0\" width=\"5\" height=\"100\" fill=\"#444444\"/>\n      </pattern>\n    </defs><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"79.91999435424805\" y1=\"96\" x2=\"385\" y2=\"96\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"73.91999435424805\" y1=\"96\" x2=\"85.91999435424805\" y2=\"96\" fill=\"none\" s ound\" stroke-width=\"0.9\"/><text text-anchor=\"end\" transform=\"translate(67.91999435424805 168.66666666666666)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">60</text><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"79.91999435424805\" y1=\"184.88888888888889\" x2=\"385\" y2=\"184.88888888888889\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"73.91999435424805\" y1=\"184.88888888888889\" x2=\"85.91999435424805\" y2=\"184.88888888888889\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><text text-anchor=\"end\" transform=\"translate(67.91999435424805 190.88888888888889)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">50</text><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"79.91999435424805\" y1=\"207.11111111111111\" x2=\"385\" y2=\"207.11111111111111\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"73.91999435424805\" y1=\"207.11111111111111\" x2=\"85.91999435424805\" y2=\"207.11111111111111\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><text text-anchor=\"end\" transform=\"translate(67.91999435424805 213.11111111111111)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">40</text><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"79.91999435424805\" y1=\"229.33333333333331\" x2=\"385\" y2=\"229.33333333333331\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"73.91999435424805\" y1=\"229.33333333333331\" x2=\"85.91999435424805\" y2=\"229.33333333333331\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><text text-anchor= rimson Text\">0</text><text text-anchor=\"middle\" transform=\"translate(24 196) rotate(-90)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">Percentage</text><line xmlns=\"http://www.w3.org/2000/svg\" x1=\"79.91999435424805\" y1=\"96\" x2=\"79.91999435424805\" y2=\"296\" fill=\"none\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.9\"/><rect xmlns=\"http://www.w3.org/2000/svg\" x=\"113.8177727593316\" y=\"276\" height=\"20\" width=\"33.89777840508355\" fill=\"#666666\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><rect xmlns=\"http://www.w3.org/2000/svg\" x=\"147.71555116441516\" y=\"289.3333333333333\" height=\"6.666666666666667\" width=\"33.89777840508355\" fill=\"#CCCCCC\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><rect xmlns=\"http://www.w3.org/2000/svg\" x=\"181.61332956949872\" y=\"100.44444444444446\" height=\"195.55555555555554\" width=\"33.89777840508355\" fill=\"#000000\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><text xmlns=\"http://www.w3.org/2000/svg\" x=\"0\" y=\"0\" text-anchor=\"end\" transform=\"translate(174.58444036695695 315.84) rotate(-40)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">percentage of forms</text><rect xmlns=\"http://www.w3.org/2000/svg\" x=\"249.40888637966583\" y=\"207.11111111111111\" height=\"88.88888888888889\" width=\"33.89777840508355\" fill=\"#666666\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><rect xmlns=\"http://www.w3.org/2000/svg\" x=\"283.3066647847494\" y=\"287.1111111111111\" height=\"8.88888888888889\" width=\"33.89777840508355\" fill=\"#CCCCCC\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><rect xmlns=\"http://www.w3.org/2000/svg\" x=\"317.20444318983294\" y=\"173.77777777777777\" height=\"122.22222222222223\" width=\"33.89777840508355\" fill=\"#000000\" stroke=\"#000000\" stroke-linecap=\"round\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><text xmlns=\"http://www.w3.org/2000/svg\" x=\"0\" y=\"0\" text-anchor=\"end\" transform=\"translate(310.1755539872912 315.84) rotate(-40)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">percentage of penalties</text><text text-anchor=\"middle\" transform=\"translate(232.45999717712402 24)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">Percentages of Form 4720s Filed and</text><text text-anchor=\"middle\" transform=\"translate(232.45999717712402 48)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">Total Penalties Assessed on Private</text><text text-anchor=\"middle\" transform=\"translate(232.45999717712402 72)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\">Foundations, by Taxable Activity, 2005</text><text text-anchor=\"middle\" transform=\"translate(232.45999717712402 464.67122253417966)\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\"> </text><rect xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" x=\"103.13541412353516\" y=\"481.8312225341797\" height=\"103\" width=\"208.7291717529297\" stroke=\"#000000\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><rect xmlns=\"http://www.w3.org/2000/svg\" x=\"110.13541412353516\" y=\"493.8312225341797\" height=\"12\" width=\"12\" fill=\"#666666\" stroke=\"#000000\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><text transform=\"translate(132.13541412353516 505.8312225341797)\" text-anchor=\"top\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\"> self-dealing</text><rect xmlns=\"http://www.w3.org/2000/svg\" x=\"110.13541412353516\" y=\"525.8312225341797\" height=\"12\" width=\"12\" fill=\"#CCCCCC\" stroke=\"#000000\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><text transform=\"translate(132.13541412353516 537.8312225341797)\" text-anchor=\"top\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\"> taxable expenditures</text><rect xmlns=\"http://www.w3.org/2000/svg\" x=\"110.13541412353516\" y=\"557.8312225341797\" height=\"12\" width=\"12\" fill=\"#000000\" stroke=\"#000000\" stroke-linejoin=\"mitre\" stroke-width=\"0.9\"/><text transform=\"translate(132.13541412353516 569.8312225341797)\" text-anchor=\"top\" fill=\"#000000\" font-size=\"19.84\" font-family=\"Crimson Text\"> undistributed income</text></g></svg></figure><div class=\"sr-only\" role=\"region\" aria-label=\"Long description for bar graph titled Percentages of Form 4720s Filed and Total Penalties Assessed on Private Foundations, by Taxable Activity, 2005\"><ul>\n<li>For each data category, the following bars are shown:<br/>\n<ul>\n<li>self-dealing</li>\n<li>taxable expenditures</li>\n<li>undistributed income</li>\n</ul>\n</li>\n<li>The data for the 2 categories are as follows:<br/>\n<ul>\n<li>Percentage of forms:<br/>\n<ul>\n<li>self-dealing: 9%</li>\n<li>taxable expenditures: 3%</li>\n<li>undistributed income: 88%</li>\n</ul>\n</li>\n<li>Percentage of penalties:<br/>\n<ul>\n<li>self-dealing: 40%</li>\n<li>taxable expenditures: 4%</li>\n<li>undistributed income: 55%</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul></div>\n<p>While US public charities, like Commonfund, must file Form 990 yearly with the IRS, private foundations, such as the Robert Wood Johnson Foundation, must file a different form, 990-PF. In addition, foundations that engage in certain prohibited activities must also file Form 4720 and pay a penalty tax on the money involved. Prohibited activities for private foundations include &ldquo;self-dealing&rdquo; (conducting activities that benefit foundation insiders), making taxable expenditures such as grants to noncharitable entities, and failing to cross a required threshold in making charitable distributions from income. Out of the organizations that filed Form 990-PF in the year 2005, <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span></p>","answerOptions":[{"id":"384eb4dd-b8ae-4a87-9c4b-5bc2f1a27f92","content":"<p>those that filed Form 4720 because they engaged in self-dealing paid, on average, lower penalties than those that filed Form 4720 because they did not meet the minimum charitable distribution requirement.</p>"},{"id":"4c5697df-953d-496d-9972-e682b5a28df7","content":"<p>those that filed Form 4720 because they engaged in self-dealing and those that filed Form 4720 because of their taxable expenditures collectively paid a smaller portion of the total penalty than those that filed Form 4720 because they did not meet the minimum charitable distribution requirement.</p>"},{"id":"9eef7cda-a7be-4915-b743-bad520d7e554","content":"<p>more filed Form 4720 because they failed to meet the minimum charitable distribution requirement than did so in the following year.</p>"},{"id":"e158abef-c117-4f95-a759-c5434713d20f","content":"<p>those that filed Form 4720 because they did not meet the minimum charitable distribution requirement paid, on average, higher penalties than those organizations that filed Form 990 but also filed Form 4720 for the same reason.</p>"}],"displayNumber":"13"}]},{"id":"26af5c6b-fd83-41da-83aa-f7a82ac0a03e","type":"chunk","items":[{"id":"b6f548b5-6d04-4843-985f-c190f5e27045","type":"mcq","stem":"<p>Which finding, if true, would most directly challenge the assertion about the Bantu expansion presented in the text?</p>","stimulus":"<p>The Bantu expansion refers to the gradual dispersal of Bantu-speaking peoples (which today include, among other groups, the Tutsi in Rwanda and the Zulu in South Africa) and their languages from an ancestral homeland in West-Central Africa across much of sub-Saharan Africa over approximately 3,500 years, starting about 4,000&ndash;5,000 years ago (<span data-ssml-say-as=\"characters\">ya</span>). Citing the discovery of pounding equipment dating as far back as 5,000 <span data-ssml-say-as=\"characters\">ya</span> consistent with processing of plant foods, some researchers have asserted that the Bantu expansion can be explained by the farming/language dispersal hypothesis. This hypothesis proposes that the dispersal of many of the world&rsquo;s large language families&mdash;for instance, Indo-European&mdash;was driven primarily by the adoption of agriculture.</p>","answerOptions":[{"id":"1da13368-d6fb-428d-bcda-ee7d4bf2c5a7","content":"<p>Lexical reconstructions indicate that the earliest Bantu speakers’ words for yams, starchy tubers that are today an agricultural staple throughout sub-Saharan Africa, were inherited from languages predating the arrival of Bantu ancestral groups in their homeland.</p>"},{"id":"d0350b31-d22a-4166-8fd2-5c65c48f3db3","content":"<p>Among the earliest archaeobotanical evidence of plant farming in East Africa, which Bantu-speaking peoples may have reached as early as 3,500 <span data-ssml-say-as=\"characters\">ya</span>, are traces of cowpea (<em>Vigna unguiculata</em>), a legume crop believed to have originated in West Africa, which were discovered in the Kakapel Rockshelter in present-day Kenya.</p>"},{"id":"372fa664-c71a-48a1-9d57-1f406195a2ae","content":"<p>The earliest unambiguous archaeobotanical evidence of plant cultivation and domestication in West-Central Africa consists of pearl millet (<em>Pennisetum glaucum</em>) found in three sites in present-day Cameroon dated to around 2,200&ndash;2,350 <span data-ssml-say-as=\"characters\">ya</span> and in one site in the present-day Democratic Republic of the Congo dated to around 2,200 <span data-ssml-say-as=\"characters\">ya</span>.</p>"},{"id":"8f1d4564-f6dc-489a-8617-4c3671b6c12d","content":"<p>Reconstructed vocabulary from Proto-Bantu, the ancestral language from which all later Bantu languages descended, contains terms for some wild plant species that early Bantu speakers actively managed and cultivated but that were never fully domesticated into true crop plants.</p>"}],"displayNumber":"14"}]},{"id":"d08cdc17-30d2-4ae4-ae88-df047d7a52d6","type":"chunk","items":[{"id":"f4073794-5bf3-4ba6-ac3a-faed911275cb","type":"mcq","stem":"<p>Which choice most logically completes the text?</p>","stimulus":"<p>Episodes in which technologies fall into disuse after a period of adoption, as occurred with the circa 2000 BCE disappearance of wheel fashioning in ceramics in the ancient Levant, are informative for understanding the factors shaping technological development in ancient societies. However, it can be unclear whether an absence of artifacts signifies a cultural shift or is merely an effect of gaps in the archaeological record. A dataset of gold objects, including rings and earrings, recovered from Bronze and Iron Age sites at Nosiri, Oshakan, and other places in the Caucasus reveals a steep drop in the total number of gold artifacts beginning around 1500 BCE in some locations. That this drop represents a genuine instance of cultural change is likely, given that <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span></p>","answerOptions":[{"id":"bfc6a275-d1a8-4c23-8aaf-e100d3b4ab7e","content":"<p>far fewer gold objects dating to earlier than 1500 BCE have been recovered from sites in the Caucasus than have been recovered from comparably old sites outside the region.&nbsp;</p>"},{"id":"770363d2-0eb7-435e-8d6c-4f05ae3a9cd8","content":"<p>a much larger number of Caucasus sites dating from after 1500 BCE are represented in the dataset than sites dating from before 1500 BCE are.&nbsp;</p>"},{"id":"45f9e055-490b-41f6-b198-92cffd10bd4e","content":"<p>there is a positive relationship between the number of gold objects found at Caucasus sites and the sites&rsquo; respective distances from nearby sources of gold, such as gold ore deposits.&nbsp;</p>"},{"id":"718aebea-a094-48ec-ab2b-e4db224bf0ce","content":"<p>the proportion of gold objects to other types of objects recovered is significantly higher at Nosiri than at Oshakan despite the two sites&rsquo; close proximity.&nbsp;</p>"}],"displayNumber":"15"}]},{"id":"2ea2f2bc-4371-46bd-a9c9-1f11c805854d","type":"chunk","items":[{"id":"4ca9307a-4770-43be-b954-7aa79b6afd3c","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>Because the artworks at Storm King Art Center, a sculpture park in New York&rsquo;s Hudson Valley, <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> displayed outdoors, curators must select pieces that can withstand the elements. Mark di Suvero&rsquo;s <em>Frog Legs</em> (<span data-ssml-say-as=\"date\">2002</span>), for instance, is made of a weather-resistant steel known for its exceptional durability.</p>","answerOptions":[{"id":"b884d332-92fb-46c4-995a-2a00257aa584","content":"<p>was</p>"},{"id":"333590ff-aaca-42bb-a412-d7460f3bb242","content":"<p>are</p>"},{"id":"09b7af53-217d-4ef9-a6c1-cef9c925647b","content":"<p>is</p>"},{"id":"19ecb1e6-c5bc-428d-9abe-77e7c3214de9","content":"<p>being</p>"}],"displayNumber":"16"}]},{"id":"a9168314-a02b-4bb4-becd-8aca0e4af519","type":"chunk","items":[{"id":"593320bc-cdef-478a-8ef8-21124e91d836","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>&ldquo;Coalition&rdquo; is the term for a group of male <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> across the Greater Kruger National Park of South Africa, many coalitions vie for territory. Between <span data-ssml-say-as=\"date\">2006</span> and <span data-ssml-say-as=\"date\">2012</span>, the lions of the Mapogo coalition&mdash;including Pretty Boy, Kinky Tail, and <span data-ssml-sub-alias=\"Mr\">Mr.</span> T&mdash;thrived within a part of the park called the Sabi Sands.</p>","answerOptions":[{"id":"dc794436-98cd-4704-8e1c-d7f49f73d78c","content":"<p>lions<span data-ssml-say-as=\"characters\">,</span></p>"},{"id":"25cdc15b-9ae0-4277-8ebf-ab7cb6554ddd","content":"<p>lions</p>"},{"id":"3d882cc3-b83e-4c44-a399-3c718bb8730a","content":"<p>lions and</p>"},{"id":"2c5c3f7d-d587-47de-901a-0f8085a8d4c8","content":"<p>lions<span data-ssml-say-as=\"characters\">,</span> and</p>"}],"displayNumber":"17"}]},{"id":"5186228a-d659-48ab-af23-e20c84ec74c5","type":"chunk","items":[{"id":"e143559b-4547-4399-a863-3ae9fd99e53d","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>The utility of the FTSE All-Share Index, which calculates the total value of a portfolio of stocks traded on the UK stock market, is twofold: first, <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> the stock values into a single number, it offers a simple metric by which investors can easily track and compare market performance quarter to quarter; second, its diversified basket of stocks can be replicated in the form of an index fund, thus turning over 550 different stocks into a single tradable asset.</p>","answerOptions":[{"id":"05cc2465-7edd-47f7-8753-0753cecb4b8d","content":"<p>they condense</p>"},{"id":"45ea05f3-b4fe-4c80-9250-3763ba91cfc8","content":"<p>it condenses</p>"},{"id":"6a1c8add-2847-48b5-a0a3-02a019c70b9f","content":"<p>to condense</p>"},{"id":"0a7b08e3-abec-4cc5-8fbf-f1e73022553c","content":"<p>in condensing</p>"}],"displayNumber":"18"}]},{"id":"d02f7bc4-3893-410e-84aa-cdba7ebd6f80","type":"chunk","items":[{"id":"6257e824-d443-4e73-b40d-8c25c68d3c39","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>In <span data-ssml-say-as=\"date\">2022</span>, 58 percent of the United Kingdom&rsquo;s exports, in terms of dollar value, were manufactured <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> the United Kingdom relies on manufactured goods for the majority of its exports places it in a more stable economic position, generally speaking, than countries that rely primarily on raw materials, which are more sensitive to market fluctuations.</p>","answerOptions":[{"id":"9bb882d8-fbc4-4d5e-ae84-3c3a4e233a46","content":"<p>goods that<span data-ssml-say-as=\"characters\">,</span></p>"},{"id":"94ec91e7-f271-4602-b9d9-911d741e1901","content":"<p>goods<span data-ssml-say-as=\"characters\">,</span> that</p>"},{"id":"35c8c432-f9cd-44c9-841e-f088368f94ec","content":"<p>goods<span data-ssml-say-as=\"characters\">.</span> That</p>"},{"id":"cfb0dfb2-468c-42f5-888b-2e224d1c277c","content":"<p>goods that</p>"}],"displayNumber":"19"}]},{"id":"c7f9a76a-2a86-4629-a57d-aa28dd16a41c","type":"chunk","items":[{"id":"b044ef80-b99e-4fd8-8671-656d9966a3a9","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>While improvising, a guitarist may add expression without causing dissonance by swapping the <span data-ssml-say-as=\"characters\">iii7</span> chord for its opposite, the <span data-ssml-say-as=\"characters\">bVI6</span> chord. This concept of harmonic opposites originated in the music theory text <em>A Theory of Harmony </em>(<span data-ssml-say-as=\"date\">1985</span>) by Ernst Levy. British musician Jacob Collier <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> Levy&rsquo;s concept and, in a <span data-ssml-say-as=\"date\">2017</span> YouTube interview that went viral among music theory enthusiasts, give it the name &ldquo;negative harmony.&rdquo;</p>","answerOptions":[{"id":"70341e8d-2e2e-4a56-badd-f44eb7eb8a93","content":"<p>would popularize</p>"},{"id":"ad3e665c-a2bb-4232-a43a-9bb212f7dacb","content":"<p>popularized</p>"},{"id":"933219b4-144f-4f75-ba0b-8f13558c6fcf","content":"<p>had popularized</p>"},{"id":"798d54b7-2f9e-47b3-a4dd-74ddc096571e","content":"<p>has popularized</p>"}],"displayNumber":"20"}]},{"id":"fea0861d-817c-4b1e-9fe8-6093e2aab41b","type":"chunk","items":[{"id":"e1ccee38-09a1-467d-b4a7-1dbd49e85391","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>That the Indo-European language of Montserrat Creole, a language mainly spoken in Montserrat, has only about 7,600 living <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> the linguists at the New York City&ndash;based Endangered Language Alliance, who recently identified a group of Montserrat Creole speakers in the city&rsquo;s borough of Manhattan, in the Central Harlem neighborhood.</p>","answerOptions":[{"id":"9fe7959b-52cc-4969-b623-948205350bf9","content":"<p>speakers and concerns</p>"},{"id":"20e11af9-73e8-4859-94b9-1b43002b8915","content":"<p>speakers, concerning</p>"},{"id":"e5c8ea57-68d9-4a92-9e31-c6eb63bd034a","content":"<p>speakers concerns&nbsp;</p>"},{"id":"cd029615-187e-4c01-a7a7-23ba536150a2","content":"<p>speakers, which concerns</p>"}],"displayNumber":"21"}]},{"id":"856cdbe5-12d0-4fdf-84a6-fad15152ee9a","type":"chunk","items":[{"id":"1ddebb30-b03a-4a40-bca4-0985b4f09798","type":"mcq","stem":"<p>Which choice completes the text so that it conforms to the conventions of Standard English?</p>","stimulus":"<p>In a <span data-ssml-say-as=\"date\">2012</span> study, &Oslash;jvind Moestrup and colleagues established that the plankton species <em>Mesodinium chamaeleon</em> is mixotrophic, meaning that it is capable of both phototrophy (photosynthetic activity) and phagotrophy (consuming prey). Such empirical evidence of mixotrophy in plankton can be difficult to <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> the activation of a particular feeding strategy depending on a host of physiological and environmental factors that researchers struggle to disentangle.</p>","answerOptions":[{"id":"128e659d-fb13-412e-9b77-af98bc161fe8","content":"<p>obtain<span data-ssml-say-as=\"characters\">,</span> though<span data-ssml-say-as=\"characters\">;</span></p>"},{"id":"f34d071c-f780-4030-b497-d146a146c2f8","content":"<p>obtain<span data-ssml-say-as=\"characters\">,</span> though</p>"},{"id":"c8dcfc56-5722-4d10-a351-0164949d98e8","content":"<p>obtain<span data-ssml-say-as=\"characters\">,</span> though<span data-ssml-say-as=\"characters\">,</span></p>"},{"id":"4e0b7843-9cb9-448f-be05-cc2a08ddcc07","content":"<p>obtain<span data-ssml-say-as=\"characters\">;</span> though<span data-ssml-say-as=\"characters\">,</span></p>"}],"displayNumber":"22"}]},{"id":"12f5a4c3-76ff-406d-894a-3b159d8525c6","type":"chunk","items":[{"id":"5c557302-b098-42d9-96ea-d213a3567710","type":"mcq","stem":"<p>Which choice completes the text with the most logical transition?</p>","stimulus":"<p>Seamounts vary greatly in height, from the 2,000-meter Bear Seamount in the Atlantic Ocean to the 3,900-meter Patton Seamount in the Pacific Ocean. <span aria-hidden=\"true\">______</span><span class=\"sr-only\">blank</span> these underwater mountains can vary in terms of formation: some are the result of tectonic activity and others of meteor impacts.</p>","answerOptions":[{"id":"b85c3143-1b31-4db5-abe7-d1c4d895b3b0","content":"<p>As an example of their different locations,</p>"},{"id":"ae127627-5499-4911-8882-1d99f999dd1a","content":"<p>Despite their different locations,</p>"},{"id":"2f4dc3e0-f7b4-4e11-951d-bc195c7e13d2","content":"<p>As a result of their differences in height,</p>"},{"id":"f5a4cc9b-61a7-46a8-953f-600d3055f091","content":"<p>In addition to their differences in height,</p>"}],"displayNumber":"23"}]},{"id":"0d27fb84-9b5d-4e22-afbc-fd1abcbcd722","type":"chunk","items":[{"id":"07669925-b23d-4329-abb5-319fb28d4d2c","type":"mcq","stem":"<p>The student wants to provide an example of a public service that Chapantongo is responsible for. Which choice most effectively uses relevant information from the notes to accomplish this goal?</p>","stimulus":"<p>While researching a topic, a student has taken the following notes:</p>\n<ul>\n<li>Chapantongo is a municipality in the state of Hidalgo, Mexico.</li>\n<li>Municipalities are governmental regions responsible for providing many public services to their residents.</li>\n<li>One service they provide is water treatment. </li>\n<li>Chapantongo&rsquo;s population was 12,967 in 2020.</li>\n<li>Hidalgo is divided into 84 municipalities.</li>\n</ul>","answerOptions":[{"id":"88c264dc-1faf-45c5-9322-3d537370948c","content":"<p>Chapantongo&mdash;a governmental region in the state of Hidalgo, Mexico&mdash;provides public services to its residents.</p>"},{"id":"a9e505c7-221e-4a2d-a746-446631260528","content":"<p>As a municipality, Chapantongo is responsible for providing water treatment to its residents.</p>"},{"id":"80676b0a-ae21-443b-9ef6-1013488078ff","content":"<p>Chapantongo is one of 84 municipalities in Hidalgo providing public services to their communities.</p>"},{"id":"d7c56144-fd23-4690-a2e2-98d1f0b861a0","content":"<p>In 2020, the municipality of Chapantongo had a population of 12,967.</p>"}],"displayNumber":"24"}]},{"id":"17cc6548-c8df-4203-add7-10efbba608f5","type":"chunk","items":[{"id":"65b79448-7061-418c-86d4-b4fb4cdb0dc4","type":"mcq","stem":"<p>Which choice most effectively uses information from the given sentences to emphasize the location of the figure in <em>New Day Coming</em>?</p>","stimulus":"<ul>\n<li>Calida Garcia Rawles is an African American painter.</li>\n<li>She is known for her large-scale, hyperrealistic paintings depicting African American figures in water.</li>\n<li>The painting <em>Yesterday Called and Said We Were Together</em>&nbsp;(48 &times; 60 in) depicts two unidentifiable figures with their arms outstretched floating in&nbsp;the upper left of the canvas.</li>\n<li><em>New Day Coming</em>&nbsp;(48 &times; 120 in) depicts a woman in a white dress floating on the left side of the canvas.</li>\n<li>She paints the water with vivid blue colors, including midnight blue and ultramarine.</li>\n<li>The mood in the paintings is relaxed.</li>\n</ul>","answerOptions":[{"id":"9c75403e-44b9-4d69-8fd8-cfcf1649caf1","content":"<p>In Rawles&rsquo;s painting <em>New Day Coming</em>, a woman is depicted on the left side of the canvas.</p>"},{"id":"38e91355-ba7a-4c1c-8105-daabf9e3c657","content":"<p>While the number of figures may differ, constant among Rawles&rsquo;s hyperrealistic works is the relaxed mood that the paintings evoke.</p>"},{"id":"1a8b6aa6-262a-49b2-989b-cc3641866331","content":"<p>Rawles captures the water in paintings such as <em>Yesterday Called and Said We Were Together</em> and <em>New Day Coming</em> in vivid hues of midnight blue and ultramarine.&nbsp;</p>"},{"id":"0c534d9e-feb0-415d-ab5f-c9bd8a46cb09","content":"<p>At 48 by 120 inches, Rawles&rsquo;s <em>New Day Coming</em> is even larger than the sizable 48-by-60-inch painting <em>Yesterday Called and Said We Were Together</em>.</p>"}],"displayNumber":"25"}]},{"id":"e53b2e86-3423-471f-8fda-460008105169","type":"chunk","items":[{"id":"76ab1c24-e6a9-43c3-a7f0-436d697887f2","type":"mcq","stem":"<p>Which choice most effectively uses information from the given sentences to specify the test site&rsquo;s climate?</p>","stimulus":"<ul>\n<li>In a 2010 study, Clark and Tilman tested the effect of plant litter on seedling emergence in a grassland setting.</li>\n<li>Plant litter includes dead leaves and other plant material.</li>\n<li>The test site was a flooded grassland in the United States.</li>\n<li>It was in a temperate midlatitude climate.</li>\n<li>The researchers found that in these environmental conditions the presence of plant litter had a negative effect on seedling emergence.</li>\n</ul>","answerOptions":[{"id":"45046df7-63dd-457f-8421-7861755dae74","content":"<p>In a 2010 study, Clark and Tilman found that the presence of plant litter had a negative effect on seedling emergence.</p>"},{"id":"11d79af7-ea68-428b-9945-0be3bf6e390c","content":"<p>Clark and Tilman&rsquo;s study was conducted in a temperate midlatitude climate.</p>"},{"id":"f4a09daf-d9d0-470f-838c-4217229410c5","content":"<p>A test was conducted in the United States to study the effect of plant litter on seedling emergence in a given climate.</p>"},{"id":"0054ed4b-f2e8-48ab-82d2-8fdc20821614","content":"<p>Clark and Tilman tested the effect of dead leaves and other plant material on seedling emergence in the United States.</p>"}],"displayNumber":"26"}]},{"id":"6d659f7b-7ae3-44a2-b0b7-e99a33be467e","type":"chunk","items":[{"id":"7ac5390a-c114-4faf-a448-71cd48ed99e1","type":"mcq","stem":"<p>The student wants to emphasize a difference between the two periodicals. Which choice most effectively uses relevant information from the notes to accomplish this goal? &nbsp;</p>","stimulus":"<p>While researching a topic, a student has taken the following notes:</p>\n<ul>\n<li>Benjamin Griffith Brawley&rsquo;s poem &ldquo;Shakespeare&rdquo; was published in the May 1915 issue of <em>The Crisis</em>.</li>\n<li><em>The Crisis</em> was founded in 1910 and is still published today.&nbsp;</li>\n<li>Georgia Douglas Johnson&rsquo;s poem &ldquo;Paradox&rdquo; was published in the June 1926 issue of <em>The Messenger</em>.</li>\n<li><em>The Messenger</em> was published from 1917 to 1928.</li>\n<li><em>The Crisis</em> and <em>The Messenger</em> were periodicals that were influential during the Harlem Renaissance.</li>\n<li>The Harlem Renaissance was a New York&ndash;based Black artistic and cultural movement that began in the 1910s and continued into the 1930s.</li>\n</ul>","answerOptions":[{"id":"0346ccd5-22c2-4dfa-80c0-95b9ba8d0cd6","content":"<p>Although both periodicals published poetry, <em>The Messenger</em> was founded years before <em>The Crisis</em>.&nbsp;</p>"},{"id":"a252eb32-9577-4559-8ca9-05b4c02b0e99","content":"<p>Brawley and Johnson published &ldquo;Shakespeare&rdquo; and &ldquo;Paradox,&rdquo; respectively, during the Harlem Renaissance, which began in the 1910s and continued into the 1930s.&nbsp;</p>"},{"id":"5696c736-3779-48bc-a0c9-e9a8ea2d4119","content":"<p>In contrast to Brawley&rsquo;s poem &ldquo;Shakespeare,&rdquo; Johnson&rsquo;s poem &ldquo;Paradox&rdquo; was published in a periodical that was influential during the Harlem Renaissance.&nbsp;</p>"},{"id":"87744cf4-59c0-41c1-b115-9690e6755435","content":"<p>While <em>The Messenger</em> ceased publication in 1928, <em>The Crisis</em> remains in print to this day. &nbsp;</p>"}],"displayNumber":"27"}]}],"calculatorAdvantage":["None"],"defaultDuration":32,"enableTts":false},{"id":"89c329a7-88f1-4b0a-9301-b36386809783","type":"routing","title":"Section 2, Module 1: Math","instructions":"<p class=\"dap_body\"><span>The questions in this section address a number of important math skills.</span></p><p class=\"dap_body\"><span>Use of a calculator is permitted for all questions. A reference sheet, calculator, and these directions can be accessed throughout the test.</span></p><p class=\"dap_body\"><span>Unless otherwise indicated:</span></p><ul><li><p class=\"dap_body\"><span>All variables and expressions represent real numbers.</span></p></li><li><p class=\"dap_body\"><span>Figures provided are drawn to scale.</span></p></li><li><p class=\"dap_body\"><span>All figures lie in a plane.</span></p></li><li><p class=\"dap_body\"><span>The domain of a given function </span><i>f</i><span> is the set of all real numbers </span><i>x</i><span> for which&nbsp;</span><math alttext=\"f left parenthesis x right parenthesis\" xmlns=\"http://www.w3.org/1998/Math/MathML\" is-custom-alt=\"false\"><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo></math><span>&nbsp;is a real number.</span></p></li></ul><p class=\"dap_body\"><span>For <strong>multiple-choice questions</strong>, solve each problem and choose the correct answer from the choices provided. Each multiple-choice question has a single correct answer.</span></p><p class=\"dap_body\"><span>For <strong>student-produced response questions</strong>,<strong> </strong>solve each problem and enter your answer as described below.&nbsp;</span></p><ul><li><p class=\"dap_body\"><span>If you find <strong>more than one correct answer</strong>, enter only one answer.</span></p></li><li><p class=\"dap_body\"><span>You can enter up to 5 characters for a <strong>positive</strong> answer and up to 6 characters (including the negative sign) for a <strong>negative</strong> answer.</span></p></li><li><p class=\"dap_body\"><span>If your answer is a <strong>fraction</strong> that doesn’t fit in the provided space, enter the decimal equivalent.</span></p></li><li><p class=\"dap_body\"><span>If your answer is a <strong>decimal</strong> that doesn’t fit in the provided space, enter it by truncating or rounding at the fourth digit.</span></p></li><li><p class=\"dap_body\"><span>If your answer is a <strong>mixed number</strong> (such as&nbsp;</span><math alttext=\"3 and one half\" xmlns=\"http://www.w3.org/1998/Math/MathML\" is-custom-alt=\"true\"><mn>3</mn><mfrac><mn>1</mn><mn>2</mn></mfrac></math><span>), enter it as an improper fraction (7/2) or its decimal equivalent (3.5).</span></p></li><li><p class=\"dap_body\"><span>Don’t enter <strong>symbols</strong> such as a percent sign, comma, or dollar sign.</span></p></li></ul><figure class=\"table\"><table id=\"cb-a-0e98dd5e-0fce-4510-b989-ce1759efa371\"><caption>Examples</caption><thead><tr><th id=\"cb-a-0e98dd5e-0fce-4510-b989-ce1759efa371-1\"><p style=\"text-align:center;\">Answer</p></th><th id=\"cb-a-0e98dd5e-0fce-4510-b989-ce1759efa371-2\"><p style=\"text-align:center;\">Acceptable ways to&nbsp;<br/>enter answer</p></th><th id=\"cb-a-0e98dd5e-0fce-4510-b989-ce1759efa371-3\"><p style=\"text-align:center;\">Unacceptable: will&nbsp;<br/>NOT receive credit</p></th></tr></thead><tbody><tr><th id=\"cb-a-0e98dd5e-0fce-4510-b989-ce1759efa371-4\"><p style=\"text-align:center;\">&nbsp;<math alttext=\"3.5\" xmlns=\"http://www.w3.org/1998/Math/MathML\" is-custom-alt=\"false\"><mn>3.5</mn></math></p></th><td id=\"cb-a-0e98dd5e-0fce-4510-b989-ce1759efa371-5\" headers=\"cb-a-0e here are a total of <math alttext=\"2,100\"><mn>2,100</mn>\n</math> milligrams of phosphorus in a sample of soil. Each kilogram of this sample contains <math alttext=\"700\"><mn>700</mn>\n</math> milligrams of phosphorus. Which equation represents this situation, where <math alttext=\"x\"><mi>x</mi>\n</math> is the mass, in kilograms, of the sample of soil?</p>","answerOptions":[{"id":"cf476b39-30ca-44e8-8648-133f1b75b4c1","content":"<p><math alttext=\"x plus 700 equals 2,100\"><mrow>\n\t<mrow>\n\t\t<mi>x</mi>\n\t\t<mo>+</mo>\n\t\t<mn>700</mn>\n\t</mrow>\n\t<mo>=</mo>\n\t<mn>2,100</mn>\n</mrow>\n</math></p>"},{"id":"b731c121-6150-496b-966a-03958889befe","content":"<p><math alttext=\"2,100 x equals 700\"><mrow>\n\t<mrow>\n\t\t<mn>2,100</mn>\n\t\t<mi>x</mi>\n\t</mrow>\n\t<mo>=</mo>\n\t<mn>700</mn>\n</mrow>\n</math></p>"},{"id":"18e96634-e5ff-4ef2-a1c7-e6af6c84d53d","content":"<p><math alttext=\"x plus 2,100 equals 700\"><mrow>\n\t<mrow>\n\t\t<mi>x</mi>\n\t\t<mo>+</mo>\n\t\t<mn>2,100</mn>\n\t</mrow>\n\t<mo>=</mo>\n\t<mn>700</mn>\n</mrow>\n</math></p>"},{"id":"dde1d1c7-eff3-4557-ab40-ba543aaceb3b","content":"<p><math alttext=\"700 x equals 2,100\"><mrow>\n\t<mrow>\n\t\t<mn>700</mn>\n\t\t<mi>x</mi>\n\t</mrow>\n\t<mo>=</mo>\n\t<mn>2,100</mn>\n</mrow>\n</math></p>"}],"displayNumber":"4"}]},{"id":"3b33a9da-a9f4-4d01-8b89-480c57a89761","type":"chunk","items":[{"id":"127e6cc3-7746-4351-9b11-d8795ebc562b","type":"mcq","stem":"<p style=\"text-align: center;\"><math alttext=\"upper P left parenthesis t right parenthesis equals 19.5 left parenthesis 1.036 right parenthesis Superscript t\"><mi>P</mi><mfenced><mi>t</mi></mfenced><mo>=</mo><mn>19.5</mn><msup><mfenced><mn>1.036</mn></mfenced><mi>t</mi></msup></math></p>\n<p>The function <math alttext=\"upper P\"><mi>P</mi>\n</math> gives the predicted population, in millions, of a certain country for the period from <math alttext=\"1984\"><mn>1984</mn></math> to <math alttext=\"2018\"><mn>2018</mn></math>, where <math alttext=\"t\"><mi>t</mi>\n</math> is the number of years after <math alttext=\"1984\"><mn>1984</mn></math>. According to this function, what is the best interpretation of the statement &ldquo;<math alttext=\"upper P left parenthesis 5 right parenthesis\"><mi>P</mi><mfenced><mn>5</mn></mfenced></math> is approximately equal to <math alttext=\"23.27\"><mn>23.27</mn>\n</math>&rdquo;?</p>","answerOptions":[{"id":"3023ee94-5546-4ced-8dca-fdde400ec8a1","content":"<p style=\"text-align: left;\">In <math alttext=\"1984\"><mn>1984</mn></math>, the predicted population of this country was approximately <math alttext=\"5\"><mn>5</mn>\n</math> million.</p>"},{"id":"7a2d3e6c-3af4-4780-b82b-74d50f4d4eb9","content":"<p style=\"text-align: left;\">In <math alttext=\"1984\"><mn>1984</mn></math>, the predicted population of this country was approximately <math alttext=\"23.27\"><mn>23.27</mn>\n</math> million.</p>"},{"id":"5d5c9b7e-d280-40cd-bfc5-a4ba7e7ecc0c","content":"<p style=\"text-align: left;\"><math alttext=\"23.27\"><mn>23.27</mn>\n</math> years after <math alttext=\"1984\"><mn>1984</mn></math>, the predicted population of this country was approximately <math alttext=\"5\"><mn>5</mn>\n</math> million.</p>"},{"id":"e291b8c6-81f0-41ee-b161-31e1c97ad1b2","content":"<p style=\"text-align: left;\"><math alttext=\"5\"><mn>5</mn>\n</math> years after <math alttext=\"1984\"><mn>1984</mn></math>, the predicted population of this country was approximately <math alttext=\"23.27\"><mn>23.27</mn>\n</math> million.</p>"}],"displayNumber":"5"}]},{"id":"6ec67a08-84fc-4160-9dcd-54c70fa1df05","type":"chunk","items":[{"id":"bf942c84-7fa5-4d34-80af-dbd8adce9064","type":"mcq","stem":"<p style=\"text-align: center;\"><math alttext=\"f left parenthesis x right parenthesis equals 3 x plus b\"><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><mrow><mn>3</mn></mrow><mi>x</mi><mo>+</mo><mi>b</mi></math></p>\n<p style=\"text-align: left;\">For the linear function <math alttext=\"f\"><mi>f</mi>\n</math>, <math alttex nction, what was the estimated depth, to the nearest meter, of the seal <math alttext=\"10\"><mn>10</mn>\n</math> minutes after it entered the water?</p>","displayNumber":"20"}]},{"id":"212afee4-419e-448d-9bed-3fb7c1950048","type":"chunk","items":[{"id":"92f8834f-1e50-4c64-a570-0410b050778a","type":"mcq","stem":"<p style=\"text-align: left;\">The functions <math alttext=\"f\"><mi>f</mi>\n</math> and <math alttext=\"g\"><mi>g</mi>\n</math> are defined by the given equations, where <math alttext=\"x greater than or equals 0\"><mi>x</mi><mo>&#8805;</mo><mn>0</mn></math>, <math alttext=\"a\"><mi>a</mi>\n</math> and <math alttext=\"b\"><mi>b</mi>\n</math> are integer constants, <math alttext=\"a less than b\"><mi>a</mi><mo>&#60;</mo><mi>b</mi></math>, and&nbsp;<math alttext=\"a greater than 1\"><mi>a</mi><mo>&#62;</mo><mn>1</mn></math>. If&nbsp;<math alttext=\"y equals f left parenthesis x right parenthesis\"><mi>y</mi><mo>=</mo><mi>f</mi><mfenced><mi>x</mi></mfenced></math> and&nbsp;<math alttext=\"y equals g left parenthesis x right parenthesis\"><mi>y</mi><mo>=</mo><mi>g</mi><mfenced><mi>x</mi></mfenced></math> are graphed in the <em>xy</em>-plane, which of the following equations displays, as a constant or coefficient, the minimum value of the function it defines, where <math alttext=\"x greater than or equals 0\"><mi>x</mi><mo>&#8805;</mo><mn>0</mn></math>?</p>\n<ol style=\"list-style-type: upper-roman;\">\n<li style=\"text-align: left;\"><math alttext=\"f left parenthesis x right parenthesis equals a left parenthesis 0.64 right parenthesis Superscript minus b x\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mi>a</mi><msup><mfenced><mn>0.64</mn></mfenced><mrow><mo>-</mo><mi>b</mi><mi>x</mi></mrow></msup></math></li>\n<li style=\"text-align: left;\"><math alttext=\"g left parenthesis x right parenthesis equals a left parenthesis 1.36 right parenthesis Superscript x plus 2 Baseline plus b\"><mi>g</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mi>a</mi><msup><mfenced

    const pkg = examDataRaw.package;
    const examData = pkg.test;
    const scoringData = pkg.scoring.sections;
    
    let questions = [];
    let currentIdx = 0;

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('open');
    }

    function polyfillMath(container) {
        // Fix mfenced (parentheses) and msup/msub children count issues
        const mfenceds = container.querySelectorAll('mfenced');
        mfenceds.forEach(el => {
            const open = el.getAttribute('open') || '(';
            const close = el.getAttribute('close') || ')';
            const sep = el.getAttribute('separators') || ',';
            const mrow = document.createElementNS("http://www.w3.org/1998/Math/MathML", "mrow");
            const openMo = document.createElementNS("http://www.w3.org/1998/Math/MathML", "mo");
            openMo.textContent = open;
            mrow.appendChild(openMo);
            Array.from(el.children).forEach((child, i) => {
                mrow.appendChild(child.cloneNode(true));
                if (i < el.children.length - 1) {
                    const sepMo = document.createElementNS("http://www.w3.org/1998/Math/MathML", "mo");
                    sepMo.textContent = sep;
                    mrow.appendChild(sepMo);
                }
            });
            const closeMo = document.createElementNS("http://www.w3.org/1998/Math/MathML", "mo");
            closeMo.textContent = close;
            mrow.appendChild(closeMo);
            el.parentNode.replaceChild(mrow, el);
        });
    }

    function init() {
        document.getElementById('exam-title').innerText = examData.title || 'SAT Operational Exam';
        questions = [];
        const navList = document.getElementById('nav-list');
        navList.innerHTML = '';
        let m2CountRW = 0, m2CountMath = 0;

        examData.sections.forEach((sec, sIdx) => {
            let displayTitle = sec.title || `Section ${sIdx + 1}`;
            if (displayTitle.includes('Reading and Writing') && displayTitle.includes('Module 2')) {
                m2CountRW++;
                displayTitle = displayTitle.replace('Module 2', m2CountRW === 1 ? 'Module 2 (Easy)' : 'Module 2 (Hard)');
            } else if (displayTitle.includes('Math') && displayTitle.includes('Module 2')) {
                m2CountMath++;
                displayTitle = displayTitle.replace('Module 2', m2CountMath === 1 ? 'Module 2 (Easy)' : 'Module 2 (Hard)');
            }

            const secLi = document.createElement('li');
            secLi.className = 'nav-sec';
            secLi.innerText = displayTitle;
            navList.appendChild(secLi);

            let qCounter = 1;
            (sec.chunks || []).forEach((chunk) => {
                (chunk.items || []).forEach((item) => {
                    const qIdx = questions.length;
                    questions.push({ secId: sec.id, secDisplay: displayTitle, qNum: qCounter, item: item });
                    const li = document.createElement('li');
                    li.className = 'nav-item';
                    li.id = `nav-${qIdx}`;
                    li.innerHTML = `<span style="margin-right:8px; opacity:0.6">#${qCounter}</span> ${item.id.substring(0, 8)}...`;
                    li.onclick = () => { renderQuestion(qIdx); if(window.innerWidth < 768) toggleSidebar(); };
                    navList.appendChild(li);
                    qCounter++;
                });
            });
        });

        if (questions.length > 0) renderQuestion(0);
    }

    function renderQuestion(idx) {
        if (idx < 0 || idx >= questions.length) return;
        currentIdx = idx;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        const activeNav = document.getElementById(`nav-${idx}`);
        if(activeNav) activeNav.classList.add('active');

        const q = questions[idx];
        const item = q.item;
        document.getElementById('current-section-title').innerText = `${q.secDisplay} | Q${q.qNum}`;
        document.getElementById('question-counter').innerText = `${idx + 1}/${questions.length}`;
        const container = document.getElementById('question-container');
        
        let correctKeys = [];
        if (scoringData && scoringData[q.secId] && scoringData[q.secId].questions) {
            const sq = scoringData[q.secId].questions[item.id];
            if (sq && sq.keys) correctKeys = sq.keys;
        }

        let html = `<div class="card fade-in">`;
        if (item.stimulus) html += `<div class="stimulus">${item.stimulus}</div>`;
        if (item.stem) html += `<div class="stem">${item.stem}</div>`;

        if (item.type === 'mcq' && item.answerOptions) {
            html += `<div class="options">`;
            const letters = ['A', 'B', 'C', 'D'];
            item.answerOptions.forEach((opt, i) => {
                const isCorrect = correctKeys.includes(opt.id);
                html += `<div class="option ${isCorrect ? 'correct' : ''}"><div class="opt-letter">${letters[i]}</div><div class="opt-content">${opt.content}</div></div>`;
            });
            html += `</div>`;
        } else {
            html += `<div style="margin-top:20px;"><div style="color:var(--text-muted); font-size:0.75rem; text-transform:uppercase; margin-bottom:5px;">Official Answer</div><div class="spr-answer" style="font-size:1.2rem; padding:12px 20px;">${correctKeys.join(' / ') || 'N/A'}</div></div>`;
        }

        html += `</div>`;
        html += `<div style="display: flex; gap: 10px; margin-top: 10px; padding-bottom: 20px;" class="fade-in"><button class="nav-btn" style="background:var(--surface-border);" onclick="renderQuestion(${idx - 1})" ${idx === 0 ? 'disabled' : ''}>Back</button><button class="nav-btn" onclick="renderQuestion(${idx + 1})" ${idx === questions.length - 1 ? 'disabled' : ''}>Next</button></div>`;
        
        container.innerHTML = html;
        polyfillMath(container);
        container.scrollTop = 0;
    }

    init();
  </script>
